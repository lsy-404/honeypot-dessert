<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>蜜罐甜品屋 | Tiny Projects</title>
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: "微软雅黑", sans-serif; user-select: none; }
  body { background: #fff5f8; min-width: 1100px; transition: background .3s; }

  .top-bar { height: 50px; background: #ffb6c1; display: flex; align-items: center; padding: 0 20px; gap: 10px; position: relative; transition: background .3s; }
  .top-btn { padding: 7px 14px; border: none; border-radius: 5px; color: white; font-weight: bold; cursor: pointer; font-size: 14px; white-space: nowrap; }
  .btn-start { background: #2e8b57; }
  .btn-pause { background: #f0ad4e; }
  .btn-end { background: #d9534f; }
  .btn-shop { background: #9b59b6; }
  .btn-book { background: #2d8659; }
  .btn-night { background: #34495e; }
  .top-btn:disabled { background: #ccc; cursor: not-allowed; }
  .info-text { margin-left: auto; color: #8b003a; font-weight: bold; font-size: 15px; white-space: nowrap; transition: color .3s; }

  .options-wrap { position: relative; }
  .btn-options { background: #34495e; }
  .options-menu { position: absolute; right: 0; top: 44px; background: #fff; border: 2px solid #ffb6c1; border-radius: 10px; box-shadow: 0 6px 20px rgba(0,0,0,.18); padding: 6px; display: none; flex-direction: column; gap: 4px; z-index: 500; min-width: 150px; }
  .options-menu.open { display: flex; }
  .opt-item { padding: 8px 14px; border: none; border-radius: 6px; background: #ecf0f1; color: #2c3e50; font-weight: bold; cursor: pointer; font-size: 13px; text-align: left; }
  .opt-item:hover { background: #dfe6e9; }
  .opt-item.danger { background: #fdecea; color: #c0392b; }

  .game-main { display: flex; height: 650px; }
  .game-main.paused { pointer-events: none; }

  .wait-area { width: 200px; background: #fff0f5; border-right: 2px solid #ffb6c1; padding: 10px; transition: background .3s, border-color .3s; }
  .wait-area h3 { color: #8b003a; text-align: center; margin-bottom: 10px; transition: color .3s; }
  .guest-card { background: white; border: 2px solid #ffb6c1; border-radius: 8px; padding: 8px; margin-bottom: 8px; cursor: pointer; transition: all 0.2s; }
  .guest-card.selected { border-color: #ff4d6d; background: #ffd1dc; transform: scale(1.02); }
  .hearts { color: #ff4d6d; font-size: 14px; margin-bottom: 3px; white-space: nowrap; }
  .guest-name { font-size: 12px; color: #8b003a; font-weight: bold; margin: 1px 0; }
  .guest-desc { font-size: 10px; color: #999; line-height: 1.1; margin: 1px 0; }
  .guest-count { font-size: 12px; color: #666; }

  .dining-area { flex: 1; background: #ffeaf2; position: relative; transition: background .3s; }
  .dining-area h3 { color: #8b003a; position: absolute; top: 10px; left: 50%; transform: translateX(-50%); z-index: 1; transition: color .3s; }
  .tables-canvas { width: 100%; height: 100%; position: relative; --floor-base: #faf0e0; --floor-plank: #f3e0c1; --floor-grain: #ecd5ae; }

  .table { width: 160px; height: 130px; background: white; border: 3px solid #ffb6c1; border-radius: 12px; position: absolute; cursor: pointer; transition: background .3s, border-color .3s; }
  .table.dirty { background: #e0e0e0; border-color: #999; }
  .table-label { position: absolute; top: -22px; left: 50%; transform: translateX(-50%); font-size: 13px; color: #8b003a; font-weight: bold; white-space: nowrap; }
  .table-guest { position: absolute; width: 90px; text-align: center; font-size: 11px; z-index: 18; }
  .table-btn { position: absolute; padding: 3px 8px; background: #ff6b9d; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 11px; left: 50%; transform: translateX(-50%); }
  .btn-checkout { background: #2e8b57; }

  .bubble { position: absolute; top: -35px; left: 10px; right: 10px; background: white; border: 2px solid #ffb6c1; border-radius: 8px; padding: 5px; font-size: 11px; color: #8b003a; text-align: center; z-index: 5; }

  .waiter { width: 40px; height: 40px; background: #87ceeb; border: 2px solid #4a90b8; border-radius: 50%; position: absolute; display: flex; align-items: center; justify-content: center; color: white; font-weight: bold; font-size: 12px; z-index: 10; left: 5px; top: 180px; }
  .cleaner { width: 40px; height: 40px; background: #f4a261; border: 2px solid #d7833f; border-radius: 50%; position: absolute; display: flex; align-items: center; justify-content: center; z-index: 9; left: 5px; top: 180px; }
  .cleaner-icon { font-size: 20px; }
  .deco-plant { position: absolute; font-size: 22px; z-index: 1; pointer-events: none; }
  .waiter-items { position: absolute; top: -18px; left: 50%; transform: translateX(-50%); display: flex; gap: 2px; font-size: 14px; white-space: nowrap; }

  .kitchen-area { width: 220px; background: #fff0f5; border-left: 2px solid #ffb6c1; padding: 10px; transition: background .3s, border-color .3s; }
  .kitchen-area h3 { color: #8b003a; text-align: center; margin-bottom: 10px; transition: color .3s; }
  .chef-station { background: white; border: 2px solid #ffb6c1; border-radius: 10px; padding: 10px; margin-bottom: 15px; cursor: pointer; }
  .chef-station h4 { color: #8b003a; text-align: center; margin-bottom: 5px; font-size: 14px; }
  .cooking-text { text-align: center; font-size: 12px; color: #666; margin-bottom: 8px; min-height: 30px; }
  .progress-bar { width: 100%; height: 8px; background: #eee; border-radius: 4px; overflow: hidden; margin-bottom: 8px; }
  .progress-fill { height: 100%; background: #ff6b9d; width: 0%; transition: width 0.1s linear; }
  .pickup-btn { width: 100%; padding: 5px; background: #ff6b9d; color: white; border: none; border-radius: 5px; cursor: pointer; }
  .pickup-btn:disabled { background: #ccc; cursor: not-allowed; }
  .queue-info { font-size: 11px; color: #8b003a; text-align: center; margin-bottom: 8px; }

  .coffee-machine { background: white; border: 2px solid #a0522d; border-radius: 10px; padding: 15px; text-align: center; color: #a0522d; font-size: 13px; cursor: pointer; display: none; }

  .waiter-status { margin-top: 15px; text-align: center; font-size: 12px; color: #8b003a; transition: color .3s; }

  .tutorial-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 100; display: none; pointer-events: none; }
  .tutorial-box { position: absolute; background: white; border: 3px solid #ff6b9d; border-radius: 12px; padding: 20px; width: 380px; box-sizing: border-box; text-align: center; pointer-events: auto; }
  .tutorial-box p { color: #8b003a; margin-bottom: 15px; line-height: 1.5; }
  .tutorial-btn { padding: 6px 25px; background: #ff6b9d; color: white; border: none; border-radius: 5px; cursor: pointer; }
  .gm-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 200; display: none; align-items: center; justify-content: center; }
  .gm-box { background: white; border: 3px solid #ff6b9d; border-radius: 14px; padding: 24px 28px; width: 320px; max-width: 85vw; box-sizing: border-box; text-align: center; box-shadow: 0 8px 30px rgba(0,0,0,0.2); }
  .gm-title { font-size: 17px; font-weight: bold; color: #8b003a; margin-bottom: 10px; }
  .gm-msg { color: #555; line-height: 1.6; margin-bottom: 18px; white-space: pre-line; font-size: 14px; }
  .gm-btns { display: flex; gap: 10px; justify-content: center; }
  .gm-btn { padding: 8px 24px; border: none; border-radius: 6px; cursor: pointer; font-size: 14px; font-weight: bold; }
  .gm-btn-ok { background: #ff6b9d; color: white; }
  .gm-btn-yes { background: #2ecc71; color: white; }
  .gm-btn-no { background: #95a5a6; color: white; }
  .tutorial-skip-btn { margin-left: 10px; padding: 6px 15px; background: #bbb; color: white; border: none; border-radius: 5px; cursor: pointer; font-size: 12px; }
  .highlight-box { position: absolute; border: 3px solid #ffeb3b; border-radius: 5px; pointer-events: none; }

  .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 200; display: none; align-items: center; justify-content: center; }
  .modal-content { width: 550px; max-height: 85vh; background: white; border-radius: 15px; padding: 25px; overflow-y: auto; }
  .modal-content h2 { color: #8b003a; text-align: center; margin-bottom: 15px; }
  .modal-content h3 { color: #8b003a; margin: 15px 0 8px; font-size: 16px; }
  .upgrade-item { display: flex; justify-content: space-between; align-items: center; padding: 8px 12px; border-bottom: 1px solid #eee; }
  .buy-btn { padding: 5px 15px; background: #ff6b9d; color: white; border: none; border-radius: 5px; cursor: pointer; }
  .buy-btn:disabled { background: #ccc; cursor: not-allowed; }

  .book-tabs { display: flex; gap: 8px; justify-content: center; margin-bottom: 14px; }
  .book-tab { padding: 8px 22px; border: 2px solid #2d8659; background: #fff; color: #2d8659; border-radius: 20px; cursor: pointer; font-weight: bold; }
  .book-tab.active { background: #2d8659; color: #fff; }
  .book-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .book-card { display: flex; gap: 10px; border: 1px solid #eee; border-radius: 10px; padding: 10px; background: #fafafa; }
  .book-card.locked { opacity: 0.55; background: #f2f2f2; }
  .book-card .bc-icon { font-size: 32px; width: 40px; text-align: center; }
  .book-card .bc-body { flex: 1; }
  .book-card .bc-name { font-weight: bold; color: #8b003a; font-size: 14px; }
  .book-card .bc-desc { font-size: 11px; color: #999; margin: 2px 0; }
  .book-card .bc-row { font-size: 12px; color: #555; margin-top: 3px; }
  .stars { color: #f5a623; letter-spacing: 1px; }
  .stars .empty { color: #ddd; }
  .hud-wrap { position: absolute; top: 6px; left: 50%; transform: translateX(-50%); z-index: 40; display: flex; flex-direction: column; align-items: center; gap: 4px; pointer-events: none; }
  .hud-combo { background: linear-gradient(90deg,#ff8a5c,#ff5d8f); color: #fff; padding: 4px 14px; border-radius: 16px; font-weight: bold; font-size: 13px; box-shadow: 0 2px 8px rgba(255,93,143,.4); }
  .hud-event { background: #fff7e0; border: 2px solid #ffb347; color: #b36b00; padding: 4px 14px; border-radius: 14px; font-size: 12px; font-weight: bold; min-width: 160px; text-align: center; }
  .hud-challenge { background: #eafaf1; border: 2px solid #2ecc71; color: #1e8449; padding: 4px 14px; border-radius: 14px; font-size: 12px; }
  .hud-challenge.done { background: #2ecc71; color: #fff; border-color: #27ae60; }
  .shop-tabs { display: flex; gap: 8px; justify-content: center; margin-bottom: 12px; }
  .shop-tab { padding: 8px 16px; border: 2px solid #ff6b9d; background: #fff; color: #ff6b9d; border-radius: 18px; cursor: pointer; font-weight: bold; font-size: 13px; }
  .shop-tab.active { background: #ff6b9d; color: #fff; }
  .sub-tabs { display: flex; gap: 6px; justify-content: center; margin-bottom: 10px; }
  .sub-tab { padding: 5px 18px; border: 1px solid #bbb; background: #fff; color: #666; border-radius: 14px; cursor: pointer; font-size: 12px; }
  .sub-tab.active { background: #9b59b6; color: #fff; border-color: #9b59b6; }
  #guestToastWrap { position: fixed; top: 70px; left: 50%; transform: translateX(-50%); z-index: 300; display: flex; flex-direction: column; align-items: center; gap: 10px; pointer-events: none; }
  .guest-toast { background: rgba(255,255,255,0.97); border: 3px solid #ff6b9d; border-radius: 14px; padding: 14px 24px; text-align: center; box-shadow: 0 6px 20px rgba(0,0,0,0.2); animation: toastPop 0.3s ease; }
  .guest-toast .gt-title { color: #e63976; font-weight: bold; font-size: 16px; margin-bottom: 6px; }
  .guest-toast .gt-name { color: #8b003a; font-size: 18px; font-weight: bold; }
  .guest-toast .gt-icon { font-size: 26px; margin: 4px 0; }
  .guest-toast .gt-desc { color: #888; font-size: 13px; }
  @keyframes toastPop { from { opacity: 0; transform: translateY(-12px); } to { opacity: 1; transform: translateY(0); } }
  .guest-toast.fade-out { animation: toastFade 0.5s ease forwards; }
  @keyframes toastFade { to { opacity: 0; transform: translateY(-12px); } }

  .table-hearts { position: absolute; left: 50%; transform: translateX(-50%); bottom: -24px; font-size: 14px; white-space: nowrap; z-index: 20; }
  /* 拼桌心情固定分栏，避免同列座位或相邻座位的爱心重叠。 */
  .shared-hearts { position: absolute; top: calc(100% + 4px); left: -10px; right: -10px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px; }
  .shared-hearts .table-hearts { position: static; transform: none; min-width: 0; display: flex; align-items: center; justify-content: center; gap: 2px; font-size: 10px; line-height: 18px; }
  .heart-group-label { font-size: 10px; color: #8b003a; }
  body.night .heart-group-label { color: #ffffff; }
  .seat { position: absolute; font-size: 26px; text-align: center; line-height: 1; pointer-events: none; z-index: 3; }
  .waiter-record { position: absolute; top: -30px; left: 50%; transform: translateX(-50%); background: #fff; border: 2px solid #ff6b9d; border-radius: 8px; padding: 2px 6px; font-size: 10px; color: #8b003a; white-space: nowrap; z-index: 21; }

  .save-list { display: flex; flex-direction: column; gap: 8px; }
  .save-slot { display: flex; align-items: center; justify-content: space-between; border: 2px solid #ffd1dc; border-radius: 10px; padding: 10px 14px; background: #fffafc; cursor: pointer; transition: all .15s; }
  .save-slot:hover { border-color: #ff6b9d; background: #fff0f5; }
  .save-slot.empty { color: #aaa; }
  .save-slot.auto { border-color: #ffe0a3; background: #fffaf0; cursor: default; }
  .save-slot.auto:hover { border-color: #ffe0a3; background: #fffaf0; }
  .save-slot .slot-info { font-size: 13px; color: #555; line-height: 1.5; }
  .save-slot .slot-info b { color: #8b003a; }
  .save-slot .slot-tag { display: inline-block; background: #ffb347; color: #fff; font-size: 11px; border-radius: 4px; padding: 1px 6px; margin-left: 4px; vertical-align: middle; }
  .save-slot .slot-del { background: #fdecea; color: #c0392b; border: none; border-radius: 5px; padding: 4px 10px; cursor: pointer; font-size: 12px; }
  .save-slot .slot-del:hover { background: #f9d6d2; }
  .save-slot .slot-load { background: #eafaf1; color: #1e8449; border: none; border-radius: 5px; padding: 4px 10px; cursor: pointer; font-size: 12px; }
  .save-slot .slot-load:hover { background: #d5f5e3; }

  /* ===================== 夜间模式（蓝黑色调） ===================== */
  body.night { background: #0d1420; }
  body.night .top-bar { background: #152238; }
  body.night .info-text { color: #e6f0ff; }
  body.night .wait-area { background: #101a2b; border-right-color: #24405f; }
  body.night .wait-area h3 { color: #e6f0ff; }
  body.night .dining-area { background: #0f1826; }
  /* 升级地板沿用夜间蓝黑色调，保留二级地板纹理。 */
  body.night .tables-canvas { --floor-base: #182536; --floor-plank: #1c2b3d; --floor-grain: #233449; }
  body.night .dining-area h3 { color: #e6f0ff; }
  body.night .kitchen-area { background: #101a2b; border-left-color: #24405f; }
  body.night .kitchen-area h3 { color: #e6f0ff; }
  body.night .guest-card { background: #16233a; border-color: #2c4a70; }
  body.night .guest-card.selected { background: #1d3350; border-color: #5b9bd5; }
  body.night .guest-name { color: #e6f0ff; }
  body.night .guest-desc { color: #b6cbe6; }
  body.night .guest-count { color: #d6e6ff; }
  body.night .table { background: #16233a; border-color: #2c4a70; }
  body.night .table.dirty { background: #1a2330; border-color: #3a4b5f; }
  body.night .table-label { color: #e6f0ff; }
  body.night .bubble { background: #16233a; border-color: #2c4a70; color: #ffffff; }
  body.night .chef-station { background: #16233a; border-color: #2c4a70; }
  body.night .chef-station h4 { color: #e6f0ff; }
  body.night .cooking-text { color: #d6e6ff; }
  body.night .progress-bar { background: #1f2f47; }
  body.night .progress-fill { background: #5b9bd5; }
  body.night .queue-info { color: #e6f0ff; }
  body.night .waiter-status { color: #e6f0ff; }
  body.night .coffee-machine { background: #16233a; border-color: #2c4a70; color: #d6e6ff; }
  body.night .waiter-record { background: #16233a; border-color: #2c4a70; color: #ffffff; }
  body.night .modal-content { background: #101a2b; color: #ffffff; }
  body.night .modal-content h2, body.night .modal-content h3 { color: #ffffff; }
  body.night .upgrade-item { border-bottom-color: #24405f; }
  body.night .gm-box { background: #101a2b; border-color: #5b9bd5; color: #ffffff; }
  body.night .gm-title { color: #ffffff; }
  body.night .gm-msg { color: #ffffff; }
  body.night .gm-msg b, body.night .gm-msg strong { color: #ffffff; }
  body.night .tutorial-box { background: #101a2b; border-color: #5b9bd5; }
  body.night .tutorial-box p { color: #ffffff; }
  body.night .book-card { background: #16233a; border-color: #24405f; }
  body.night .book-card.locked { background: #1a2330; }
  body.night .book-card .bc-name { color: #ffffff; }
  body.night .book-card .bc-desc { color: #ffffff; }
  body.night .book-card .bc-row { color: #ffffff; }
  body.night .save-slot { background: #16233a; border-color: #2c4a70; }
  body.night .save-slot:hover { background: #1d3350; }
  body.night .save-slot .slot-info { color: #ffffff; }
  body.night .save-slot .slot-info b { color: #ffffff; }
  body.night .guest-toast { background: rgba(16,26,43,0.97); border-color: #5b9bd5; }
  body.night .guest-toast .gt-title { color: #ffffff; }
  body.night .guest-toast .gt-name { color: #ffffff; }
  body.night .guest-toast .gt-desc { color: #ffffff; }

  /* 夜间模式：HUD 与事件/挑战文字改为浅色/白色 */
  body.night .hud-event { background: #1b2a45; border-color: #ffb347; color: #ffffff; }
  body.night .hud-challenge { background: #123a28; border-color: #2ecc71; color: #e6f0ff; }
  body.night .hud-challenge.done { background: #2ecc71; color: #ffffff; border-color: #27ae60; }
  body.night .hud-combo { color: #ffffff; }

  /* 夜间模式：表格内联状态文字 */
  body.night .table-guest,
  body.night .table-guest div { color: #e6f0ff !important; }
  body.night .table-guest .table-btn { color: #ffffff !important; }
  body.night .table-btn.btn-checkout { color: #ffffff !important; }
  body.night .table-guest div[style*="color:#666"] { color: #d6e6ff !important; }
  body.night .table-guest div[style*="color:#c0392b"] { color: #ff9a9a !important; }
  body.night .table-guest div[style*="color:#e67e22"] { color: #ffc46b !important; }
  body.night .table-guest div[style*="color:#2e8b57"] { color: #8ef0b0 !important; }
  body.night .table-guest div[style*="color:#27ae60"] { color: #8ef0b0 !important; }
  body.night .table-guest div[style*="color:#8b003a"] { color: #e6f0ff !important; }




  /* 夜间模式：商店/图鉴中的提示文字 */
  body.night #shopModal p { color: #ffffff; }
  body.night #shopMoney { color: #ffffff; }
  body.night .upgrade-item span { color: #ffffff; }
  body.night .upgrade-item span span { color: #ffffff; }
  body.night .book-tab { background: #16233a; color: #ffffff; border-color: #5b9bd5; }
  body.night .book-tab.active { background: #5b9bd5; color: #ffffff; }
  body.night .shop-tab { background: #16233a; color: #ffffff; border-color: #5b9bd5; }
  body.night .shop-tab.active { background: #5b9bd5; color: #ffffff; }
  body.night .sub-tab { background: #16233a; color: #ffffff; border-color: #2c4a70; }
  body.night .sub-tab.active { background: #5b9bd5; color: #ffffff; border-color: #5b9bd5; }
  body.night .opt-item { background: #16233a; color: #ffffff; }
  body.night .opt-item:hover { background: #1d3350; }
  body.night .options-menu { background: #101a2b; border-color: #2c4a70; }

  /* 夜间模式：所有弹窗内的通用浅色文字兜底 */
  body.night .modal-content p,
  body.night .modal-content div,
  body.night .modal-content span,
  body.night .modal-content label { color: #ffffff; }
  body.night .modal-content span[style*="color:#999"],
  body.night .modal-content span[style*="color:#666"],
  body.night .modal-content span[style*="color:#555"],
  body.night .modal-content span[style*="color:#8b003a"] { color: #ffffff; }
  body.night .modal-content span[style*="color:#2ecc71"] { color: #ffffff; }
  body.night .modal-content p[style*="color:#8b003a"] { color: #ffffff; }
  body.night .modal-content p[style*="color:#666"] { color: #ffffff; }
  body.night .modal-content div[style*="color:#666"] { color: #ffffff; }


  /* 夜间模式：启动弹窗文字 */
  body.night #startupModal p { color: #ffffff; }
  body.night #startupSaveInfo { color: #ffffff; }

  /* 夜间弹窗统一白字：同时覆盖动态插入内容、内联颜色和无子标签的提示。 */

function isSharing(guest) {
  const table = game.tables.find(function(t) { return t.id === guest.tableId; });
  return !!(table && table.guests.length > 1);
}

// 效果由当前在店客人推导，兼容读档，并在最后一位离店后自动消失。
function hasDisruptiveGuest() {
  return game.waitingGuests.concat(game.seatedGuests).some(function(g) { return g.type === "brat"; });
}
function getServiceTempo() { return hasDisruptiveGuest() ? 3 : 1; }
function getCookingDuration(food) {
  return Math.max(0.25, food.cook_time * (1 - game.cookSpeedLevel * 0.15)) / getServiceTempo();
}
function getHeartDecayThreshold(guest, baseThreshold) {
  const def = GUEST_TYPES[guest.type] || GUEST_TYPES.normal;
  let mult = def.decay;
  if(guest.tableId && isSharing(guest)) {
    if(guest.type === "social") mult *= 0.6;
    if(guest.type === "homebody") mult *= 1.8;
    if(guest.type === "gamer") mult *= 0.7;
    if(guest.type === "couple") mult *= 0.5;
    if(guest.type === "matchmaker") mult *= 0.8;
  } else if(guest.tableId) {
    if(guest.type === "gamer") mult *= 1.3;
  }
  let envBonus = getDecorBonus();
  if(game.eventHeartBonus) envBonus += game.eventHeartBonus;
  mult /= (1 + envBonus);
  if(game.eventDecayBoost) mult *= (1 + game.eventDecayBoost);
  if(hasDisruptiveGuest()) mult *= 3;
  return Math.max(3, Math.round(baseThreshold / mult));
}

function getTipMultiplier(guest) {
  const def = GUEST_TYPES[guest.type] || GUEST_TYPES.normal;
  let m = def.tip;
  if(guest.tableId && isSharing(guest)) {
    if(guest.type === "social") m *= 1.8;
    if(guest.type === "homebody") m *= 0.7;
    if(guest.type === "matchmaker") m *= 2.0;
    if(guest.type === "couple") m *= 1.5;
    if(guest.type === "gamer") m *= 1.3;
  }
  return m;
}

function randomGuestType() {
  const available = Object.keys(GUEST_TYPES).filter(function(key) {
    return GUEST_TYPES[key].unlockDay <= game.day;
  });
  if(available.length === 0) return "normal";
  let list = available.map(function(k) {
    let w = GUEST_TYPES[k].weight || 1.0;
    if(k === "foodie" && game.eventFoodieBoost) w *= 6;
    return { key: k, weight: w };
  });
  const total = list.reduce(function(s, o) { return s + o.weight; }, 0);
  let r = Math.random() * total;
  for(let i = 0; i < list.length; i++) {
    r -= list[i].weight;
    if(r <= 0) return list[i].key;
  }
  return list[list.length - 1].key;
}

function getVisualGuests(table) {
  const seats=SEAT_MAP[table.capacity]||SEAT_MAP[6];
  const anchor=function(g) {
    const points=(g.seatIndices&&g.seatIndices.length?g.seatIndices:[0]).map(i=>seats[i]||seats[0]);
    return {x:points.reduce((n,p)=>n+p.x,0)/points.length,y:points.reduce((n,p)=>n+p.y,0)/points.length};
  };
  return table.guests.slice().sort(function(a,b) {const x=anchor(a),y=anchor(b);return x.x-y.x||x.y-y.y||table.guests.indexOf(a)-table.guests.indexOf(b);});
}
function serviceBasicsComplete() {return game.waiterSpeedLevel>=5&&game.orderRecordLevel>=2&&game.carryCapacityLevel>=3;}
function spaceBasicsComplete() {return game.waitCapacity>=5&&game.tables.length>=8&&game.tables.every(t=>t.capacity>=6);}
function upgradeUnlocked(id) {
  if(id==='smart_waiter')return game.smartWaiterOwned||serviceBasicsComplete();
  if(id==='smart_guests')return game.smartGuestsOwned||spaceBasicsComplete();
  if(id==='coffee_batch')return game.hasCoffeeMachine;
  if(id==='coffee_auto')return game.hasCoffeeMachine&&game.coffeeLevel>=1;
  return true;
}
function upgradeUnavailable(id) {
  return !upgradeUnlocked(id)||(id==='upgrade_4seat'&&!game.tables.some(t=>t.capacity===2))||(id==='upgrade_6seat'&&!game.tables.some(t=>t.capacity===4));
}
function getUpgradePrice(up) {return up.type==='level'?(up.base_price||0)*Math.pow(2,getUpgradeLevel(up.id)):(up.price||0);}
let autoServiceTimer=null, autoOwnedMove=false, autoLastAction='', autoManualUntil=0;
function renderAutomationControls() {
  [['toggleSmartWaiter',game.smartWaiterOwned,game.smartWaiterEnabled,'🤖 聪明的服务员'],['toggleSmartGuests',game.smartGuestsOwned,game.smartGuestsEnabled,'🪑 聪明的顾客']].forEach(function([id,owned,enabled,label]) {
    const el=document.getElementById(id);if(!el)return;el.hidden=!owned;el.textContent=label+'：'+(enabled?'开启':'关闭');el.setAttribute('aria-pressed',String(!!enabled));
  });
}
function toggleSmartFeature(kind) {
  const waiter=kind==='waiter',owned=waiter?'smartWaiterOwned':'smartGuestsOwned',enabled=waiter?'smartWaiterEnabled':'smartGuestsEnabled';
  if(!game[owned])return;game[enabled]=!game[enabled];
  if(waiter&&!game[enabled]) {
    clearTimeout(autoServiceTimer);autoServiceTimer=null;
    if(autoOwnedMove){game.waiterMoveToken=(game.waiterMoveToken||0)+1;stopWaiter();autoOwnedMove=false;}
    if(autoLastAction==='order'&&game.waiterRecording) {const guest=game.seatedGuests.find(g=>g.id===game.waiterRecording.guestId);if(guest&&guest.status==='recording')guest.status='waiting_order';game.waiterRecording=null;}
  }
  if(!waiter&&game[enabled])runAutoSeating();
  renderAll();if(document.getElementById('shopModal').style.display==='flex')refreshShop();
}
function requestAutoService() {
  if(autoServiceTimer||!game.smartWaiterOwned||!game.smartWaiterEnabled||game.status!=='running')return;
  autoServiceTimer=setTimeout(function(){autoServiceTimer=null;runAutoWaiter();},100);
}
function runAutoWaiter() {
  if(!game.smartWaiterOwned||!game.smartWaiterEnabled||game.status!=='running'||game.waiterMoving||game.waiterRecording||game.selectedCoffee||performance.now()<autoManualUntil)return;
  if(document.getElementById('gmOverlay').style.display==='flex'||document.getElementById('tutorialOverlay').style.display==='block')return;
  const distance=t=>{const p=getTablePosition(t.id);return Math.abs(game.waiterX-p.x-TABLE_DOCK.x)+Math.abs(game.waiterY-p.y-TABLE_DOCK.y);};
  const nearest=guests=>guests.slice().sort((a,b)=>distance(game.tables.find(t=>t.id===a.tableId))-distance(game.tables.find(t=>t.id===b.tableId)))[0];
  const meals=game.seatedGuests.filter(g=>g.status==='ordered'&&hasMealForGuest(g.id));
  if(meals.length){autoOwnedMove=true;autoLastAction='deliver';deliverFood(nearest(meals).tableId);return;}
  const orders=game.carryItems.some(i=>i.isOrder),space=game.carryItems.length<getCarryCapacity();
  const local=space?game.seatedGuests.find(g=>g.status==='waiting_order'&&isWaiterAtTable(g.tableId)):null;
  if(local){autoOwnedMove=true;autoLastAction='order';takeOrder(local.id);return;}
  if(orders||(space&&game.cookingStations.some(st=>st.order&&st.progress>=1))){autoOwnedMove=true;autoLastAction='kitchen';clickChefStation(0);return;}
  const checkoutGuest=nearest(game.seatedGuests.filter(g=>g.status==='waiting_checkout'));
  if(checkoutGuest){autoOwnedMove=true;autoLastAction='checkout';checkout(checkoutGuest.id);return;}
  const waiting=space?nearest(game.seatedGuests.filter(g=>g.status==='waiting_order')):null;
  if(waiting){autoOwnedMove=true;autoLastAction='order';takeOrder(waiting.id);return;}
  const dirty=game.tables.filter(t=>t.dirty&&!t.cleaning&&!game.cleaners.some(c=>c.targetTableId===t.id)).sort((a,b)=>distance(a)-distance(b))[0];
  if(dirty){autoOwnedMove=true;autoLastAction='clean';cleanTable(dirty.id);return;}
  autoOwnedMove=false;
}
function runAutoSeating() {
  if(game.status!=='running'||!game.smartGuestsOwned||!game.smartGuestsEnabled)return;
  const selected=game.selectedGuestId;
  for(let pass=0;pass<10&&game.waitingGuests.length;pass++) {
    const choices=[];
    game.tables.forEach(function(table){
      if(table.dirty||table.cleaning||(table.sharedOnce&&table.guests.length)||table.guests.length>=2)return;
      const free=table.capacity-table.guests.reduce((n,g)=>n+g.count,0),slots=2-table.guests.length;
      game.waitingGuests.forEach(function(a,i){
        if(a.count<=free)choices.push({table,guests:[a],waste:free-a.count,total:a.count,queue:i});
        if(slots>1)game.waitingGuests.slice(i+1).forEach(function(b){if(a.count+b.count<=free)choices.push({table,guests:[a,b],waste:free-a.count-b.count,total:a.count+b.count,queue:i});});
      });
    });
    choices.sort((a,b)=>a.waste-b.waste||b.table.guests.length-a.table.guests.length||b.total-a.total||a.queue-b.queue||a.table.capacity-b.table.capacity);
    if(!choices.length)break;
    const best=choices[0];best.guests.forEach(function(g){game.selectedGuestId=g.id;seatGuest(best.table.id);});
  }
  game.selectedGuestId=game.waitingGuests.some(g=>g.id===selected)?selected:null;
  renderWaitList();
}
function getCoffeeBatchSize(){return game.coffeeLevel>=1?2:1;}
function getCoffeeCount(){return Math.max(0,Number(game.coffeeCount)||0)||(game.coffeeReady?1:0);}
function setCoffeeCount(n){game.coffeeCount=Math.max(0,Math.floor(n));game.coffeeReady=game.coffeeCount>0;}
function processCoffeeMachine() {
  if(!game.hasCoffeeMachine)return;
  if(getCoffeeCount()===0){game.coffeeTimer++;if(game.coffeeTimer>=8){setCoffeeCount(getCoffeeBatchSize());game.coffeeTimer=0;}}
  if(game.coffeeLevel>=2) {
    while(getCoffeeCount()>0) {
      const target=game.waitingGuests.concat(game.seatedGuests).filter(g=>g.hearts<5).sort((a,b)=>a.hearts-b.hearts||(b.heartTimer||b.tableHeartTimer||0)-(a.heartTimer||a.tableHeartTimer||0))[0];
      if(!target||!useCoffeeOnGuest(target.id,true))break;
    }
  }
  renderCoffeeMachine();
}
function getShopRecommendations() {
  const picks=[];
  function addUpgrade(id,why){const up=UPGRADE_DATA.find(u=>u.id===id);if(up&&getUpgradeLevel(id)<up.max_level&&!upgradeUnavailable(id)&&!picks.some(p=>p.id===id))picks.push({id,kind:'upgrade',name:UPGRADE_LABELS[id]||up.name,price:getUpgradePrice(up),why,up});}
  function addRecipe(){const name=Object.keys(FOOD_DATA).filter(n=>!game.unlockedFoods.includes(n)&&!picks.some(p=>p.id===n)).sort((a,b)=>FOOD_DATA[a].unlock_price-FOOD_DATA[b].unlock_price)[0];if(name)picks.push({id:name,kind:'recipe',name:FOOD_DATA[name].icon+' '+name,price:FOOD_DATA[name].unlock_price,why:'增加餐品选择，逐步提升客单收入'});}
  if(game.tables.length<4){addUpgrade('add_table','先增加接待桌数，减少等候客人的积压');addUpgrade('waiter_speed','桌数增加后，提高来回服务效率');}
  else {addRecipe();if(game.chefCount<2)addUpgrade('hire_chef','多桌同时营业，增加并行制作能力');else if(game.cleanerCount<1)addUpgrade('hire_cleaner','减少脏桌占用，保持座位周转');else addUpgrade('cook_speed','缩短后厨等待时间');}
  addUpgrade('smart_waiter','服务基础已完成，可以解放手动操作');addUpgrade('smart_guests','容量升级已完成，让客人自动寻找合适座位');
  if(game.hasCoffeeMachine){addUpgrade(game.coffeeLevel<1?'coffee_batch':'coffee_auto','提高卡布奇诺供给与心情维护效率');}
  if(game.tables.length>=4){addUpgrade('carry_capacity','一次携带更多订单和餐品');addUpgrade('order_record','减少每桌点单的等待');}
  for(let i=0;i<3&&picks.length<3;i++)addRecipe();
  ['menu_optimize','tip_upgrade','heart_decay','waiter_speed','wait_capacity','day_length'].forEach(id=>{if(picks.length<3)addUpgrade(id,'继续完善日常经营效率');});
  return picks.slice(0,3);
}
function renderShopRecommendations() {
  const list=document.getElementById('recommendationList');if(!list)return;list.innerHTML='';
  const picks=getShopRecommendations();
  picks.forEach(function(pick){
    const card=document.createElement('div');card.className='recommend-card';card.dataset.recommendation=pick.id;
    const title=document.createElement('strong');title.textContent=pick.name;
    const reason=document.createElement('p');reason.textContent=pick.why;
    const btn=document.createElement('button');btn.className='buy-btn';btn.disabled=game.money<pick.price;btn.textContent=btn.disabled?'还差 '+(pick.price-game.money)+' 金币':pick.price+' 金币';
    btn.onclick=function(){if(pick.kind==='recipe')unlockFood(pick.id,pick.price);else buyUpgrade(pick.up,pick.price);};
    card.appendChild(title);card.appendChild(reason);card.appendChild(btn);list.appendChild(card);
  });
  if(!picks.length){const empty=document.createElement('p');empty.textContent='经营升级与食谱均已完成。';list.appendChild(empty);}
}

const SAVE_PREFIX = "honeypot_slot_";
const SAVE_SLOTS = 8;
const AUTO_SAVE_KEY = "honeypot_autosave";

function readSlot(i) {
  try {
    const raw = localStorage.getItem(SAVE_PREFIX + i);
    return raw ? JSON.parse(raw) : null;
  } catch(e) { return null; }
}
function writeSlot(i, data) { localStorage.setItem(SAVE_PREFIX + i, JSON.stringify(data)); }
function deleteSlot(i) { localStorage.removeItem(SAVE_PREFIX + i); }

function autoSave() {
  try {
    localStorage.setItem(AUTO_SAVE_KEY, JSON.stringify({ data: serializeGame(), savedAt: Date.now(), auto: true }));
  } catch(e) {}
}
function readAutoSave() {
  try {
    const raw = localStorage.getItem(AUTO_SAVE_KEY);
    return raw ? JSON.parse(raw) : null;
  } catch(e) { return null; }
}
function deleteAutoSave() { localStorage.removeItem(AUTO_SAVE_KEY); }

function openSaveSlots(mode) {
  const modal = document.getElementById("saveSlotModal");
  const title = document.getElementById("saveSlotTitle");
  const list = document.getElementById("saveSlotList");
  title.textContent = mode === "save" ? "💾 选择存档位（保存）" : "📂 选择存档位（读取）";
  list.innerHTML = "";

  const autoData = readAutoSave();
  if(autoData) {
    const slot = document.createElement("div");
    slot.className = "save-slot auto";
    const d = autoData.data;
    const dt = new Date(autoData.savedAt);
    const ds = dt.getFullYear() + "-" + String(dt.getMonth()+1).padStart(2,"0") + "-" + String(dt.getDate()).padStart(2,"0")
      + " " + String(dt.getHours()).padStart(2,"0") + ":" + String(dt.getMinutes()).padStart(2,"0");
    const info = document.createElement("div");
    info.className = "slot-info";
    info.innerHTML = "<b>自动存档</b><span class='slot-tag'>自动</span> · 第 " + d.day + " 天 · 金币 " + d.money +
      "<br><span style='color:#999;font-size:12px;'>" + ds + "</span>";
    slot.appendChild(info);
    if(mode === "load") {
      const actions = document.createElement("div");
      const load = document.createElement("button");
      load.className = "slot-load";
      load.textContent = "读取";
      load.onclick = function(e) {
        e.stopPropagation();
        showConfirm("读取自动存档？当前进度将被覆盖。", function() {
          applyLoadedSave(autoData);
          modal.style.display = "none";
        }, "读取自动存档");
      };
      actions.appendChild(load);
      slot.appendChild(actions);
      slot.onclick = function() {
        showConfirm("读取自动存档？当前进度将被覆盖。", function() {
          applyLoadedSave(autoData);
          modal.style.display = "none";
        }, "读取自动存档");
      };
    } else {
      const actions = document.createElement("div");
      const tag = document.createElement("span");
      tag.style.cssText = "font-size:12px;color:#b36b00;";
      tag.textContent = "不可覆盖";
      actions.appendChild(tag);
      slot.appendChild(actions);
    }
    list.appendChild(slot);
  }

  for(let i = 1; i <= SAVE_SLOTS; i++) {
    const data = readSlot(i);
    const slot = document.createElement("div");
    slot.className = "save-slot" + (data ? "" : " empty");

    let infoHtml = "";
    if(data) {
      const d = data.data;
      const dt = new Date(data.savedAt);
      const ds = dt.getFullYear() + "-" + String(dt.getMonth()+1).padStart(2,"0") + "-" + String(dt.getDate()).padStart(2,"0") + " " + String(dt.getHours()).padStart(2,"0") + ":" + String(dt.getMinutes()).padStart(2,"0");
      infoHtml = "<b>存档位 " + i + "</b> · 第 " + d.day + " 天 · 金币 " + d.money + "<br><span style='color:#999;font-size:12px;'>" + ds + "</span>";
    } else {
      infoHtml = "<b>存档位 " + i + "</b> · 空";
    }

    const info = document.createElement("div");
    info.className = "slot-info";
    info.innerHTML = infoHtml;

    const actions = document.createElement("div");
    if(data) {
      const del = document.createElement("button");
      del.className = "slot-del";
      del.textContent = "删除";
      del.onclick = function(e) {
        e.stopPropagation();
        showConfirm("确定删除存档位 " + i + " 吗？", function() {
          deleteSlot(i);
          openSaveSlots(mode);
        }, "删除存档");
      };
      actions.appendChild(del);
    }
    slot.appendChild(info);
    slot.appendChild(actions);

    slot.onclick = function() {
      if(mode === "save") {
        function doSave() {
          try {
            writeSlot(i, { data: serializeGame(), savedAt: Date.now() });
            showToast("💾 已保存到存档位 " + i);
            modal.style.display = "none";
          } catch(err) { showInfo("存档失败：" + err.message, "错误"); }
        }
        if(data) {
          showConfirm("存档位 " + i + " 已有存档，确定覆盖吗？", doSave, "覆盖存档");
        } else {
          doSave();
        }
      } else {
        if(!data) { showInfo("这个存档位是空的哦~", "提示"); return; }
        showConfirm("读取存档位 " + i + "？当前进度将被覆盖。", function() {
          applyLoadedSave(data);
          modal.style.display = "none";
        }, "读取存档");
      }
    };

    list.appendChild(slot);
  }
  modal.style.display = "flex";
}

function applyLoadedSave(parsed) {
  try {
    const d = parsed.data;
    if(game.gameLoopId) clearInterval(game.gameLoopId);
    stopWaiter();
    stopCleaners();

    const fresh = createInitialGame();
    Object.keys(d).forEach(function(k) { fresh[k] = d[k]; });
    fresh.gameLoopId = null;
    fresh.seatedGuests = fresh.tables.flatMap(function(t){return t.guests;});
    fresh.coffeeLevel = Math.max(0,Math.min(2,Number(d.coffeeLevel)||0));
    fresh.coffeeCount = typeof d.coffeeCount==='number'?Math.max(0,Math.min(fresh.coffeeLevel>=1?2:1,d.coffeeCount)):(d.coffeeReady?1:0);
    fresh.coffeeReady = fresh.coffeeCount>0;
    fresh.smartWaiterEnabled = !!fresh.smartWaiterOwned&&!!fresh.smartWaiterEnabled;
    fresh.smartGuestsEnabled = !!fresh.smartGuestsOwned&&!!fresh.smartGuestsEnabled;
    clearTimeout(autoServiceTimer);autoServiceTimer=null;autoOwnedMove=false;autoManualUntil=0;
    if(!fresh.kitchenQueue) fresh.kitchenQueue = [];
    // 兼容旧存档：移除柜子前把柜内物品转回服务员，避免订单丢失或无法打烊。
    const legacyItems = d.storage && Array.isArray(d.storage.items) ? d.storage.items : [];
    fresh.carryItems = (fresh.carryItems || []).concat(legacyItems);
    delete fresh.storage;
    if(d.activeEventId) {
      fresh.activeEvent = EVENTS.find(function(e) { return e.id === d.activeEventId; }) || null;
    }
    if(d.scheduledEventId) {
      fresh.scheduledEvent = EVENTS.find(function(e) { return e.id === d.scheduledEventId; }) || null;
    }
    if(d.dailyChallengeId) {
      fresh.dailyChallenge = DAILY_CHALLENGES.find(function(c) { return c.id === d.dailyChallengeId; }) || null;
    }
    game = fresh;

    clearBoardDom();
    game.cleaners = [];
    ensureCleaners();
    game.cleaners.forEach(function(c) {
      const el = document.getElementById(c.id);
      if(el) { el.style.left = "5px"; el.style.top = "180px"; }
    });

    applyStatusToButtons();
    applyDecor();
    applyNightMode();
    renderAll();
    updateUI();
    renderHUD();

    if(game.status === "running") gameLoop();
    showToast("📂 读档成功！第 " + game.day + " 天");
  } catch(err) {
    showInfo("读档失败，存档可能已损坏：" + err.message, "错误");
  }
}

// ===================== 服务员系统 =====================
const BASE_CANVAS_WIDTH = 800;
const TABLE_DOCK = { x: 80, y: 150 };

function getWaiterSpeed() {
  const canvas = document.getElementById("tablesCanvas");
  const scale = canvas ? (canvas.clientWidth / BASE_CANVAS_WIDTH) : 1;
  return 200 * scale * (1 + game.waiterSpeedLevel * 0.2) * (hasDisruptiveGuest() ? 2 : 1);
}

function getVerticalWalkway(x) {
  const walks = getVerticalWalkways();
  let xv = walks[0], best = Math.abs(x - walks[0]);
  walks.forEach(function(w) {
    if(Math.abs(x - w) < best) { best = Math.abs(x - w); xv = w; }
  });
  return xv;
}
function isOnWalkway(x) {
  return getVerticalWalkways().some(function(w) { return Math.abs(x - w) < 25; });
}

function getChefPos() {
  const canvas = document.getElementById("tablesCanvas");
  return { x: Math.max(25, canvas.clientWidth - 50), y: 200 };
}

function walkToTable(tableId, cb) {
  const p = getTablePosition(tableId);
  moveWaiter(p.x + TABLE_DOCK.x, p.y + TABLE_DOCK.y, cb);
}

function stopWaiter() {
  if(game.waiterMoveTimer) {
    clearTimeout(game.waiterMoveTimer);
    game.waiterMoveTimer = null;
  }
  const waiter = document.getElementById("waiter");
  if(waiter) {
    const rect = waiter.getBoundingClientRect();
    const parentRect = waiter.offsetParent ? waiter.offsetParent.getBoundingClientRect() : {left:0, top:0};
    game.waiterX = rect.left - parentRect.left + 20;
    game.waiterY = rect.top - parentRect.top + 20;
    waiter.style.transition = "none";
    waiter.style.left = (game.waiterX - 20) + "px";
    waiter.style.top = (game.waiterY - 20) + "px";
  }
  game.waiterMoving = false;
}

function moveWaiter(targetX, targetY, callback) {
  const waiter = document.getElementById("waiter");
  game.waiterMoveToken = (game.waiterMoveToken || 0) + 1;
  const myToken = game.waiterMoveToken;
  if(game.waiterMoveTimer) { clearTimeout(game.waiterMoveTimer); game.waiterMoveTimer = null; }

  const parentRect = waiter.offsetParent ? waiter.offsetParent.getBoundingClientRect() : {left:0, top:0};
  const r = waiter.getBoundingClientRect();
  game.waiterX = r.left - parentRect.left + 20;
  game.waiterY = r.top - parentRect.top + 20;
  waiter.style.transition = "none";
  waiter.style.left = (game.waiterX - 20) + "px";
  waiter.style.top = (game.waiterY - 20) + "px";

  if(Math.abs(targetX - game.waiterX) < 3 && Math.abs(targetY - game.waiterY) < 3) {
    game.waiterMoving = false;
    if(callback) callback();
    autoOwnedMove=false; requestAutoService();
    return true;
  }

  const needVertical = Math.abs(targetY - game.waiterY) > 3;
  const needHorizontal = Math.abs(targetX - game.waiterX) > 3;

  const path = [];
  if(!needVertical) {
    if(needHorizontal) path.push({x: targetX, y: game.waiterY});
  } else if(!needHorizontal) {
    if(isOnWalkway(game.waiterX)) {
      path.push({x: game.waiterX, y: targetY});
    } else {
      const vx = getVerticalWalkway(targetX);
      if(Math.abs(vx - game.waiterX) > 3) path.push({x: vx, y: game.waiterY});
      path.push({x: vx, y: targetY});
    }
  } else {
    let vx;
    if(isOnWalkway(game.waiterX)) vx = game.waiterX;
    else vx = getVerticalWalkway(targetX);
    if(Math.abs(vx - game.waiterX) > 3) path.push({x: vx, y: game.waiterY});
    path.push({x: vx, y: targetY});
    if(Math.abs(targetX - vx) > 3) path.push({x: targetX, y: targetY});
  }

  game.waiterMoving = true;
  let idx = 0;

  function step() {
    if(game.waiterMoveToken !== myToken) return;
    if(idx >= path.length) {
      game.waiterMoving = false;
      waiter.style.transition = "";
      if(callback) callback();
    autoOwnedMove=false; requestAutoService();
      return;
    }
    const p = path[idx++];
    let lastTime = performance.now();
    function advance() {
      if(game.waiterMoveToken !== myToken) return;
      const now = performance.now();
      const distance = Math.abs(p.x - game.waiterX) + Math.abs(p.y - game.waiterY);
      const travel = getWaiterSpeed() * Math.min(0.1, (now - lastTime) / 1000);
      lastTime = now;
      if(distance <= travel || distance < 0.5) {
        game.waiterX = p.x; game.waiterY = p.y;
        waiter.style.transition = "none";
        updateWaiterPosition();
        step(); return;
      }
      const ratio = travel / distance;
      game.waiterX += (p.x - game.waiterX) * ratio;
      game.waiterY += (p.y - game.waiterY) * ratio;
      waiter.style.transition = "left 50ms linear, top 50ms linear";
      updateWaiterPosition();
      game.waiterMoveTimer = setTimeout(advance, 50);
    }
    advance();
  }
  step();
  return true;
}

function hasMealForGuest(guestId) {
  const guest=game.seatedGuests.find(function(g) {return String(g.id)===String(guestId);});
  return !!guest && guest.status==="ordered" && game.carryItems.some(function(item) {return !item.isOrder && String(item.guestId)===String(guestId);});
}

    if(group>=0)return (i+1)+"号桌 · 第"+(group+1)+"组";
  }
  return "客人订单";
}

  const key=JSON.stringify(game.carryItems.map(function(item) {return [item.guestId,item.food,item.count,!!item.isOrder,getItemDestination(item)];}))+"/"+getCarryCapacity();
  if(statusEl.dataset.carryKey!==key) {

// ===================== 游戏主循环 =====================
function gameLoop() {
  game.gameLoopId = setInterval(function() {
    if(game.status !== "running") return;

    runAutoSeating();
    requestAutoService();
    if(game.timeLeft > 0) game.timeLeft--;
    else if(!game.dayEnding) game.dayEnding = true;

    if(game.dayEnding) {
      const allDone = game.seatedGuests.length === 0
        && game.tables.every(function(t) { return !t.dirty; })
        && game.cookingStations.every(function(st){ return !st.order; })
        && game.kitchenQueue.length === 0
        && game.carryItems.length === 0
        && !game.waiterRecording;
      if(allDone) { endDay(); return; }
    }

    if(!game.dayEnding) {
      if(game.scheduledEvent && game.timeLeft <= game.eventTriggerAt) {
        triggerScheduledEvent();
      }
      if(game.activeEvent && game.eventRemaining > 0) {
        game.eventRemaining--;
        if(game.eventRemaining <= 0) expireActiveEvent();
      }
    }

    if(!game.dayEnding) {
      game.spawnTimer++;
      if(!game.firstSpawnDone) {
        if(game.spawnTimer >= 2) {
          spawnGuest();
          game.firstSpawnDone = true;
          game.spawnTimer = 0;
          tutorialNext(2);
        }
      } else {
        const eventBoost = game.activeEvent ? 5 + (game.eventSpawnBoost || 0) : (game.eventSpawnBoost || 0);
        const base = 30 - (game.day - 1) * 2 - (game.tables.length - 2) * 2 - eventBoost;
        const interval = Math.max(3, base);
        if(game.spawnTimer >= interval) {
          spawnGuest();
          game.spawnTimer = 0;
        }
      }
    }

    const tutorialGrace = game.tutorialEnabled && game.ordersCompleted < 2;
    for(let i = game.waitingGuests.length - 1; i >= 0; i--) {
      const g = game.waitingGuests[i];
      if(tutorialGrace) continue;
      g.heartTimer = (g.heartTimer || 0) + 1;
      const limit = getHeartDecayThreshold(g, 20 + game.heartDecayExtra);
      if(g.heartTimer >= limit) {
        g.hearts--;
        g.heartTimer = 0;
        if(g.hearts <= 0) {
          game.waitingGuests.splice(i, 1);
          game.challengeNoLeave = false;
        }
      }
    }

    game.seatedGuests.forEach(function(g) {
      if(g.status === "reading") {
        g.readTimer = Math.max(0, g.readTimer - getServiceTempo());
        if(g.readTimer <= 0) { g.status = "waiting_order"; tutorialNext(5); }
      } else if(g.status === "eating") {
        g.eatTimer = Math.max(0, g.eatTimer - getServiceTempo());
        if(g.eatTimer <= 0) { g.status = "waiting_checkout"; tutorialNext(9); }
        if(g.eatProtectTimer > 0) g.eatProtectTimer--;
        if(!tutorialGrace && (g.eatProtectTimer || 0) <= 0 && isWaiterAtTable(g.tableId)) {
          if(g.type === "homebody" || g.type === "rich" || g.type === "foodie" || g.type === "critic") {
            if(Math.random() < 0.08 && g.hearts > 0) g.hearts--;
          } else if(SHY_TYPES_SLOW.indexOf(g.type) !== -1) {
            if(Math.random() < 0.06 && g.hearts < 5) g.hearts++;
          }
        }
      }
      if((g.status !== "eating" || hasDisruptiveGuest()) && !tutorialGrace) {
        g.tableHeartTimer = (g.tableHeartTimer || 0) + 1;
        const limit = getHeartDecayThreshold(g, (20 + game.heartDecayExtra) * 1.5);
        if(g.tableHeartTimer >= limit) {
          if(g.hearts > 0) g.hearts--;
          g.tableHeartTimer = 0;
        }
      }
    });

    if(game.waiterRecording) {
      game.waiterRecording.remain = Math.max(0, game.waiterRecording.remain - getServiceTempo());
      if(game.waiterRecording.remain <= 0) finishOrderRecording();
      updateWaiterPosition();
    }

    let cleaningChanged = false;
    game.tables.forEach(function(t) {
      if(t.cleaning) {
        t.cleanTimer--;
        cleaningChanged = true;
        if(t.cleanTimer <= 0) {
          t.cleaning = false;
          t.dirty = false;
          t.sharedOnce = false;
          tutorialNext(14);
        }
      }
    });
    if(cleaningChanged) renderTables();

    autoAssignKitchenQueue();

    game.cookingStations.forEach(function(st, idx) {
      if(!st.order) return;
      const food = FOOD_DATA[st.order.food];
      const totalTime = getCookingDuration(food);
      if(st.progress < 1) st.progress = Math.min(1, st.progress + 1 / totalTime);
      const box = document.getElementById("chefStations");
      const stationEl = box ? box.children[idx] : null;
      if(stationEl) {
        const fill = stationEl.querySelector(".progress-fill");
        const txt = stationEl.querySelector(".cooking-text");
        const btn = stationEl.querySelector(".pickup-btn");
        if(fill) fill.style.width = (st.progress * 100) + "%";
        if(st.progress >= 1) {
          if(txt) txt.innerHTML = "✅ " + food.icon + " " + st.order.food + (st.order.count > 1 ? " ×" + st.order.count : "") + " 已做好";
          if(btn) { btn.disabled = false; btn.textContent = "取餐"; }
        } else {
          if(txt) txt.innerHTML = "制作中：" + food.icon + st.order.food + (st.order.count > 1 ? " ×" + st.order.count : "");
          if(btn) { btn.disabled = true; btn.textContent = "制作中…"; }
        }
      }
      if(st.progress >= 1) tutorialNext(7);
    });

    processCoffeeMachine();

    for(let i = game.bubbles.length - 1; i >= 0; i--) {
      const b = game.bubbles[i];
      if(b.persist) continue;
      b.time--;
      if(b.time <= 0) game.bubbles.splice(i, 1);
    }

    if(game.combo > 0) {
      game.comboTimer--;
      if(game.comboTimer <= 0) game.combo = 0;
    }

    updateCleaners();
    updateUI();
    renderTables();
    renderWaitList();
    renderChefStations();

    renderHUD();
  }, 1000);
}

function autoAssignKitchenQueue() {
  if(!game.kitchenQueue || game.kitchenQueue.length === 0) return;
  game.cookingStations.forEach(function(st) {
    if(!st.order && game.kitchenQueue.length > 0) {
      const order = game.kitchenQueue.shift();
      st.order = order;
      st.progress = 0;
    }
  });
  const qEl = document.getElementById("queueInfo");
  if(qEl) qEl.textContent = "后厨队列：" + (game.kitchenQueue ? game.kitchenQueue.length : 0);
}

// ===================== 客人系统 =====================
function spawnGuest(forceCount) {
  if(game.waitingGuests.length >= game.waitCapacity) return;

  const tutorialSingles = game.day === 1 && game.tutorialEnabled && game.totalSpawned < 2;

  let pool = [1, 2];
  if(game.eventCoupleBoost) pool = [2, 2, 2, 1];
  const fourCount = game.tables.filter(function(t) { return t.capacity >= 4; }).length;
  const sixCount = game.tables.filter(function(t) { return t.capacity >= 6; }).length;
  if(fourCount > 0) {
    const prob = Math.min(fourCount * 0.1, 0.4);
    if(Math.random() < prob) pool = pool.concat([3, 4]);
  }
  if(sixCount > 0) {
    const prob = Math.min(sixCount * 0.1, 0.3);
    if(Math.random() < prob) pool = pool.concat([5, 6]);
  }

  const count = (forceCount !== undefined ? forceCount : (tutorialSingles ? 1 : pool[Math.floor(Math.random() * pool.length)]));
  let type = tutorialSingles ? "normal" : randomGuestType();
  // 第 20 天起首次生成时保证见到新客人，之后按普通权重随机出现。
  if(game.day >= 20 && !game.seenTypes.includes("brat")) type = "brat";
  let finalCount = count;
  if(type === "couple") finalCount = 2;
  if(type === "brat") finalCount = 1;
  const guest = {
    id: Date.now() + Math.random(),
    count: finalCount, type: type, hearts: 5, status: "waiting",
    tableId: null, food: null, order: null,
    heartTimer: 0, tableHeartTimer: 0, readTimer: 0, eatTimer: 0, eatTotal: 0,
  };
  game.totalSpawned = (game.totalSpawned || 0) + 1;
  if(game.day === 1 && game.tutorialEnabled && game.totalSpawned === 2) tutorialNext(4);
  game.waitingGuests.push(guest);
  if(game.seenTypes.indexOf(type) === -1) {
    game.seenTypes.push(type);
    showNewGuestToast(type);
  }
  renderWaitList();
  runAutoSeating();
}

function showNewGuestToast(type) {
  const def = GUEST_TYPES[type];
  if(!def) return;
  const wrap = document.getElementById("guestToastWrap");
  const div = document.createElement("div");
  div.className = "guest-toast";
  div.innerHTML =
    '<div class="gt-title">✨ 出现新客人了！</div>' +
    '<div class="gt-icon">' + (def.icon || "🧑") + '</div>' +
    '<div class="gt-name">' + def.name + '</div>' +
    '<div class="gt-desc">' + def.desc + '</div>';
  wrap.appendChild(div);
  setTimeout(function() {
    div.classList.add("fade-out");
    setTimeout(function() { if(div.parentNode) div.parentNode.removeChild(div); }, 500);
  }, 4000);
}

function selectWaitingGuest(guestId) {
  if(game.status !== "running") return;
  if(game.selectedCoffee) { useCoffeeOnGuest(guestId); return; }
  game.selectedGuestId = game.selectedGuestId === guestId ? null : guestId;
  renderWaitList();
  tutorialNext(3);
}

const SEAT_MAP = {
  2: [{x:44,y:42},{x:116,y:42}],
  4: [{x:44,y:30},{x:116,y:30},{x:44,y:88},{x:116,y:88}],
  6: [{x:30,y:22},{x:80,y:22},{x:130,y:22},{x:30,y:96},{x:80,y:96},{x:130,y:96}],
};

function getSeatPositionsForTableByIndex(table, startIndex, guestCount) {
  const map = SEAT_MAP[table.capacity] || SEAT_MAP[6];
  return map.slice(startIndex, startIndex + guestCount);
}

function assignSeatIndices(table, guestCount) {
  const cap = table.capacity;
  const occupied = {};
  table.guests.forEach(function(g) {
    (g.seatIndices || []).forEach(function(si) { occupied[si] = true; });
  });
  if(cap === 2 && guestCount === 1 && Object.keys(occupied).length === 0) {
    const si = Math.random() < 0.5 ? 0 : 1;
    return [si];
  }
  for(let start = 0; start + guestCount <= cap; start++) {
    let ok = true;
    for(let k = 0; k < guestCount; k++) {
      if(occupied[start + k]) { ok = false; break; }
    }
    if(ok) {
      const arr = [];
      for(let k = 0; k < guestCount; k++) arr.push(start + k);
      return arr;
    }
  }
  const arr = [];
  for(let i = 0; i < cap && arr.length < guestCount; i++) {
    if(!occupied[i]) arr.push(i);
  }
  return arr;
}

function seatGuest(tableId) {
  if(game.selectedGuestId === null) return;
  const guest = game.waitingGuests.find(function(g) { return g.id === game.selectedGuestId; });
  const table = game.tables.find(function(t) { return t.id === tableId; });
  if(!guest || !table || table.dirty) return;
  if(table.sharedOnce && table.guests.length >= 1) {
    showToast("这桌已经拼过桌啦，清理后才能再拼～");
    return;
  }
  const usedSeats = table.guests.reduce(function(sum, g) { return sum + g.count; }, 0);
  if(usedSeats + guest.count > table.capacity) {
    showInfo("这张桌子座位不够啦", "提示");
    return;
  }
  game.waitingGuests = game.waitingGuests.filter(function(g) { return g.id !== guest.id; });
  guest.tableId = tableId;
  if(guest.type === "regular") {
    guest.status = "waiting_order";
    guest.readTimer = 0;
  } else {
    guest.status = "reading";
    const range = getMenuReadRange();
    guest.readTimer = range[0] + Math.floor(Math.random() * (range[1] - range[0] + 1));
  }
  guest.seatIndices = assignSeatIndices(table, guest.count);
  table.guests.push(guest);
  if(table.guests.length >= 2) table.sharedOnce = true;
  game.seatedGuests.push(guest);
  game.selectedGuestId = null;
  if(game.tutorialEnabled && table.guests.length >= 2 && game.tutorialStep === 4) tutorialNext(5);
  renderAll();
}

// ===================== 经营流程 =====================
function takeOrder(guestId) {
  if(game.status !== "running") return;
  if(game.waiterRecording) return;
  const guest = game.seatedGuests.find(function(g) { return g.id === guestId; });
  if(!guest || guest.status !== "waiting_order") return;

  if(game.carryItems.length >= getCarryCapacity()) {
    showInfo("服务员手上已满（" + game.carryItems.length + "/" + getCarryCapacity() + "），请先送餐或交单后再点单", "提示");
    return;
  }

  walkToTable(guest.tableId, function() {
    if(game.carryItems.length >= getCarryCapacity()) {
      showInfo("服务员手上已满（" + game.carryItems.length + "/" + getCarryCapacity() + "），请先送餐或交单后再点单", "提示");
      renderAll();
      return;
    }
    const recTime = getOrderRecordTime();
    if(recTime <= 0) {
      completeTakeOrder(guestId);
    } else {
      guest.status = "recording";
      game.waiterRecording = { guestId: guestId, remain: recTime };
      updateWaiterPosition();
      renderAll();
    }
  });
}

function completeTakeOrder(guestId) {
  const guest = game.seatedGuests.find(function(g) { return g.id === guestId; });
  if(!guest) return;

  if(game.carryItems.length >= getCarryCapacity()) {
    guest.status = "waiting_order";
    showInfo("服务员手上已满（" + game.carryItems.length + "/" + getCarryCapacity() + "），请先送餐或交单后再点单", "提示");
    renderAll();
    return;
  }

  let foodPool = game.unlockedFoods.slice();

  if(guest.type === "sweet_tooth") {
    const desserts = foodPool.filter(function(f) { return FOOD_DATA[f].type === "dessert"; });
    if(desserts.length) foodPool = desserts;
  }
  if(guest.type === "earlybird") {
    const drinks = foodPool.filter(function(f) { return FOOD_DATA[f].type === "drink"; });
    if(drinks.length) foodPool = drinks;
  }
  if(guest.type === "critic") {
    foodPool.sort(function(a, b) { return FOOD_DATA[b].price - FOOD_DATA[a].price; });
    const food = foodPool[0];
    guest.food = food;
    guest.order = { food: food, count: guest.count };
    guest.status = "ordered";
    game.bubbles.push({
      tableId: guest.tableId, guestId: guestId,
      text: "📋 点了：" + FOOD_DATA[food].icon + food + " ×" + guest.count,
      time: Infinity, persist: true
    });
    game.carryItems.push({ food: food, count: guest.count, isOrder: true, guestId: guestId });
    renderAll();
    return;
  }
  if(guest.type === "adventurer") {
    const latest = game.unlockedFoods[game.unlockedFoods.length - 1];
    if(latest) {
      guest.food = latest;
      guest.order = { food: latest, count: guest.count };
      guest.status = "ordered";
      game.bubbles.push({
        tableId: guest.tableId, guestId: guestId,
        text: "📋 点了：" + FOOD_DATA[latest].icon + latest + " ×" + guest.count,
        time: Infinity, persist: true
      });
      game.carryItems.push({ food: latest, count: guest.count, isOrder: true, guestId: guestId });
      renderAll();
      return;
    }
  }

  if(game.eventDrinkBoost) {
    const drinks = foodPool.filter(function(f) { return FOOD_DATA[f].type === "drink"; });
    if(drinks.length) foodPool = foodPool.concat(drinks);
  }
  if(game.eventDessertBoost) {
    const desserts = foodPool.filter(function(f) { return FOOD_DATA[f].type === "dessert"; });
    if(desserts.length) foodPool = foodPool.concat(desserts);
  }
  const food = foodPool[Math.floor(Math.random() * foodPool.length)];

  guest.food = food;
  guest.order = { food: food, count: guest.count };
  guest.status = "ordered";

  game.bubbles.push({
    tableId: guest.tableId, guestId: guestId,
    text: "📋 点了：" + FOOD_DATA[food].icon + food + " ×" + guest.count,
    time: Infinity, persist: true
  });

  game.carryItems.push({
    guestId: guestId, food: food, count: guest.count, isOrder: true
  });

  tutorialNext(6);
  renderAll();
}

function finishOrderRecording() {
  if(!game.waiterRecording) return;
  const guestId = game.waiterRecording.guestId;
  game.waiterRecording = null;
  completeTakeOrder(guestId);
  updateWaiterPosition();
}

function clickChefStation(idx) {
  if(game.status !== "running") return;
  if(game.waiterRecording) return;
  const chef = getChefPos();
  moveWaiter(chef.x, chef.y, function() {
    autoSubmitAllOrders();
    autoPickupAllReady();
  });
}

function autoSubmitAllOrders() {
  const orders = game.carryItems.filter(function(i){ return i.isOrder; });
  if(orders.length === 0) return;
  orders.forEach(function(o) {
    game.carryItems = game.carryItems.filter(function(x){ return x !== o; });
    game.kitchenQueue.push(o);
  });
  autoAssignKitchenQueue();
  renderChefStations();
  renderAll();
  showToast("📋 已提交 " + orders.length + " 个订单到后厨");
}

function autoPickupAllReady() {
  let picked = 0;
  game.cookingStations.forEach(function(st) {
    if(!st.order || st.progress < 1) return;
    if(game.carryItems.length >= getCarryCapacity()) return;
    const food = Object.assign({}, st.order, { isOrder: false });
    game.carryItems.push(food);
    st.order = null;
    st.progress = 0;
    picked++;
  });
  if(picked > 0) {
    renderChefStations();
    renderAll();
    tutorialNext(8);
    showToast("🍽️ 已拾起 " + picked + " 份做好的餐品");
  } else {
    renderAll();
  }
}

// 到桌后按当前手持物品统一送餐，避免移动期间客人或餐品变化造成误送。
function serveCarriedFoodAtTable(tableId) {
  if(game.status !== "running" || game.waiterRecording) return 0;
  const table = game.tables.find(function(t) { return t.id === tableId; });
  if(!table || table.dirty) return 0;
  const servedGuestIds = new Set();
  game.carryItems = game.carryItems.filter(function(item) {
    if(item.isOrder) return true;
    const guest = table.guests.find(function(g) {
      return g.id === item.guestId && g.status === "ordered";
    });
    if(!guest) return true;
    const eatTime = FOOD_DATA[item.food].eat_time;
    guest.status = "eating";
    guest.eatTimer = eatTime;
    guest.eatTotal = eatTime;
    guest.eatProtectTimer = 4;
    servedGuestIds.add(guest.id);
    return false;
  });
  if(servedGuestIds.size === 0) return 0;
  game.bubbles = game.bubbles.filter(function(b) {
    return !(b.persist && servedGuestIds.has(b.guestId));
  });
  tutorialNext(9);
  renderAll();
  return servedGuestIds.size;
}

function deliverFood(tableId) {
  if(game.status !== "running" || game.waiterRecording) return;
  const table = game.tables.find(function(t) { return t.id === tableId; });
  if(!table) return;
  const hasFood = game.carryItems.some(function(item) {
    return !item.isOrder && table.guests.some(function(g) {
      return g.id === item.guestId && g.status === "ordered";
    });
  });
  if(!hasFood) return;
  walkToTable(tableId, function() {
    serveCarriedFoodAtTable(tableId);
  });
}

function checkout(guestId) {
  if(game.status !== "running") return;
  if(game.waiterRecording) return;
  const guest = game.seatedGuests.find(function(g) { return g.id === guestId; });
  if(!guest || guest.status !== "waiting_checkout") return;
  walkToTable(guest.tableId, function() {
    const order = guest.order || { food: guest.food, count: guest.count };
    const f = FOOD_DATA[order.food];

    if(guest.hearts >= 4) {
      game.combo++;
      game.maxCombo = Math.max(game.maxCombo, game.combo);
      game.comboTimer = 12;
    } else if(guest.hearts <= 2) {
      game.combo = 0;
    }
    const comboBonus = game.combo * 2;
    const tipMultiplier = getTipMultiplier(guest);
    const tipPercentBase = (2 + (guest.hearts - 1) * 0.75) + game.tipLevel * 1.0;
    const itemBase = f.price * order.count;
    const tipPercent = tipPercentBase * tipMultiplier * (1 + (game.eventTipBoost || 0)) + comboBonus;
    const tip = Math.floor(itemBase * tipPercent / 100);
    const total = itemBase + tip;

    game.money += total;
    game.dayEarnings += total;
    game.foodSoldCount[order.food] = (game.foodSoldCount[order.food] || 0) + order.count;
    game.guestServedCount[guest.type] = (game.guestServedCount[guest.type] || 0) + 1;

    if(guest.hearts === 5) game.challengePerfect++;
    if(guest.type === "foodie") game.challengeFoodie++;
    if(guest.count >= 3) game.challengeBigTable++;
    if(FOOD_DATA[order.food].type === "drink") game.challengeDrink += order.count;
    else game.challengeDessert += order.count;

    const table = game.tables.find(function(t) { return t.id === guest.tableId; });
    table.guests = table.guests.filter(function(g) { return g.id !== guestId; });
    game.seatedGuests = game.seatedGuests.filter(function(g) { return g.id !== guestId; });
    if(table.guests.length === 0) table.dirty = true;

    game.ordersCompleted++;
    if(game.ordersCompleted === 1) tutorialNext(10);
    else if(game.ordersCompleted === 2) tutorialNext(13);

    renderAll();
    renderHUD();
    checkDailyChallenge();
  });
}

// ===================== 辅助函数 =====================
const TABLE_W = 160, TABLE_H = 130, GAP_X = 70, GAP_Y = 110;
let diningLayout = null;
function calculateDiningLayout() {
  const canvas = document.getElementById("tablesCanvas");
  const width = canvas.clientWidth;
  const visibleHeight = canvas.parentElement.clientHeight;
  const count = Math.max(1, game.tables.length);
  const cols = Math.max(1, Math.min(4, count, Math.floor((width - 160 + GAP_X) / (TABLE_W + GAP_X))));
  const rows = Math.ceil(count / cols);
  const blockWidth = cols * TABLE_W + (cols - 1) * GAP_X;
  const blockHeight = rows * TABLE_H + (rows - 1) * GAP_Y;
  const height = Math.max(visibleHeight, blockHeight + 220);
  return {width:width, visibleHeight:visibleHeight, count:count, cols:cols, height:height,
    x:Math.max(45, (width - 90 - blockWidth) / 2), y:Math.max(110, (height - blockHeight) / 2 - 10)};
}
function updateDiningLayout() {
  const next = calculateDiningLayout();
  if(diningLayout && (game.waiterMoving || game.waiterRecording || game.cleaners.some(function(c) { return c.moving; }))) return;
  if(diningLayout && diningLayout.width === next.width && diningLayout.visibleHeight === next.visibleHeight && diningLayout.count === next.count) return;
  let dockedTable = null;
  if(diningLayout) dockedTable = game.tables.find(function(t) {
    const p = getTablePosition(t.id);
    return Math.abs(game.waiterX - p.x - TABLE_DOCK.x) < 5 && Math.abs(game.waiterY - p.y - TABLE_DOCK.y) < 5;
  });
  diningLayout = next;
  document.getElementById("tablesCanvas").style.height = next.height + "px";
  if(dockedTable) {
    const p = getTablePosition(dockedTable.id);
    game.waiterX = p.x + TABLE_DOCK.x; game.waiterY = p.y + TABLE_DOCK.y;
    updateWaiterPosition();
  }
}
function getTablePosition(tableId) {
  const layout = diningLayout || calculateDiningLayout();
  const idx = Math.max(0, game.tables.findIndex(function(t) { return t.id === tableId; }));
  return {x:layout.x + (idx % layout.cols) * (TABLE_W + GAP_X),
    y:layout.y + Math.floor(idx / layout.cols) * (TABLE_H + GAP_Y)};
}
function getVerticalWalkways() {
  const layout = diningLayout || calculateDiningLayout();
  const walks = [25, Math.max(25, layout.x - GAP_X / 2)];
  for(let c = 0; c < layout.cols; c++) walks.push(layout.x + c * (TABLE_W + GAP_X) + TABLE_W + GAP_X / 2);
  walks.push(Math.max(25, layout.width - 50));
  return walks;
}

function isWaiterAtTable(tableId) {
  if(game.waiterMoving) return false;
  const pos = getTablePosition(tableId);
  const targetX = pos.x + TABLE_DOCK.x;
  const targetY = pos.y + TABLE_DOCK.y;
  return Math.abs(game.waiterX - targetX) < 30 && Math.abs(game.waiterY - targetY) < 30;
}

// ===================== 自动清洁工 =====================
const CLEANER_SPEED = 420;
function getCleanerDock(tableId) {
  const p = getTablePosition(tableId);
  return {x:p.x + TABLE_W / 2, y:p.y + TABLE_H + 28};
}
// 在餐桌外沿建立横纵通道，按真实路程寻找最短路线。
function planCleanerRoute(startX, startY, targetX, targetY) {
  const canvas = document.getElementById("tablesCanvas");
  const obstacles = game.tables.map(function(t) {
    const p = getTablePosition(t.id);
    return {left:p.x-20, right:p.x+TABLE_W+20, top:p.y-20, bottom:p.y+TABLE_H+20};
  });
  const inside = function(x,y,r) { return x>r.left+.01 && x<r.right-.01 && y>r.top+.01 && y<r.bottom-.01; };
  // 若窗口重排使旧位置落在桌边，允许先离开该位置。
  const blocks = obstacles.filter(function(r) { return !inside(startX,startY,r); });
  const xs = Array.from(new Set([startX,targetX,20,canvas.clientWidth-20].concat(blocks.flatMap(function(r) { return [r.left,r.right]; })))).filter(function(x) { return x>=0 && x<=canvas.clientWidth; }).sort(function(a,b) { return a-b; });
  const ys = Array.from(new Set([startY,targetY,20,canvas.clientHeight-20].concat(blocks.flatMap(function(r) { return [r.top,r.bottom]; })))).filter(function(y) { return y>=0 && y<=canvas.clientHeight; }).sort(function(a,b) { return a-b; });
  const nx=xs.length, ny=ys.length, start=ys.indexOf(startY)*nx+xs.indexOf(startX), goal=ys.indexOf(targetY)*nx+xs.indexOf(targetX);
  if(xs.indexOf(startX)<0 || ys.indexOf(startY)<0 || xs.indexOf(targetX)<0 || ys.indexOf(targetY)<0) return null;
  const coords = function(id) { return {x:xs[id%nx],y:ys[Math.floor(id/nx)]}; };
  const clear = function(a,b) {
    return !blocks.some(function(r) {
      if(Math.abs(a.y-b.y)<.01) return a.y>r.top+.01 && a.y<r.bottom-.01 && Math.max(a.x,b.x)>r.left+.01 && Math.min(a.x,b.x)<r.right-.01;
      return a.x>r.left+.01 && a.x<r.right-.01 && Math.max(a.y,b.y)>r.top+.01 && Math.min(a.y,b.y)<r.bottom-.01;
    });
  };
  const dist=new Array(nx*ny).fill(Infinity), prev=new Array(nx*ny).fill(-1), open=[start], closed=new Set();
  dist[start]=0;
  const score=function(id) {const p=coords(id);return dist[id]+Math.abs(p.x-targetX)+Math.abs(p.y-targetY);};
  while(open.length) {
    let best=0;
    for(let i=1;i<open.length;i++) if(score(open[i])<score(open[best])-.01 || (Math.abs(score(open[i])-score(open[best]))<.01 && dist[open[i]]>dist[open[best]])) best=i;
    const id=open.splice(best,1)[0];
    if(id===goal) {
      const points=[];let at=goal;while(at!==start) {points.push(coords(at));at=prev[at];}points.reverse();
      const path=[];
      points.forEach(function(p) {
        const a=path.length>1?path[path.length-2]:{x:startX,y:startY}, b=path[path.length-1];
        if(b && ((Math.abs(a.x-b.x)<.01 && Math.abs(b.x-p.x)<.01) || (Math.abs(a.y-b.y)<.01 && Math.abs(b.y-p.y)<.01))) path[path.length-1]=p;
        else path.push(p);
      });
      return {path:path,length:dist[goal]};
    }
    closed.add(id);
    const x=id%nx,y=Math.floor(id/nx), a=coords(id), neighbors=[];
    if(x>0)neighbors.push(id-1);if(x<nx-1)neighbors.push(id+1);if(y>0)neighbors.push(id-nx);if(y<ny-1)neighbors.push(id+nx);
    neighbors.forEach(function(n) {
      if(closed.has(n))return;const b=coords(n);if(!clear(a,b))return;
      const next=dist[id]+Math.abs(a.x-b.x)+Math.abs(a.y-b.y);
      if(next<dist[n]-.01) {dist[n]=next;prev[n]=id;if(!open.includes(n))open.push(n);}
    });
  }
  return null;
}

function cancelCleanerForTable(tableId) {
  game.cleaners.forEach(function(c) {
    if(c.targetTableId === tableId) {
      c.token++;
      if(c.moveTimer) { clearTimeout(c.moveTimer); c.moveTimer = null; }
      c.moving = false;
      c.targetTableId = null;
      const el = document.getElementById(c.id);
      if(el) {
        const parentRect = el.offsetParent ? el.offsetParent.getBoundingClientRect() : {left:0, top:0};
        const r = el.getBoundingClientRect();
        c.x = r.left - parentRect.left + 20;
        c.y = r.top - parentRect.top + 20;
        el.style.transition = "none";
        el.style.left = (c.x - 20) + "px";
        el.style.top = (c.y - 20) + "px";
      }
    }
  });
}

function ensureCleaners() {

    game.cleaners.push(c);

    el.innerHTML = '<div class="cleaner-icon">🧹</div>';
    canvas.appendChild(el);
  }
}

function moveCleaner(c, targetX, targetY, callback, plannedRoute) {
  const el = document.getElementById(c.id);
  if(!el) return;
  c.token++;
  const myToken = c.token;
  if(c.moveTimer) { clearTimeout(c.moveTimer); c.moveTimer = null; }
  const parentRect = el.offsetParent ? el.offsetParent.getBoundingClientRect() : {left:0, top:0};
  const r = el.getBoundingClientRect();
  c.x = r.left - parentRect.left + 20;
  c.y = r.top - parentRect.top + 20;
  el.style.transition = "none";
  el.style.left = (c.x - 20) + "px";
  el.style.top = (c.y - 20) + "px";
  const route = plannedRoute || planCleanerRoute(c.x,c.y,targetX,targetY);
  if(!route) { c.moving=false; c.targetTableId=null; return; }
  const path = route.path;
  c.moving = true;
  let idx = 0;
  function step() {
    if(c.token !== myToken) return;
    if(idx >= path.length) {
      c.moving = false;
      el.style.transition = "";
      if(callback) callback();
      return;
    }
    const p = path[idx++];
    const dist = Math.abs(p.x - c.x) + Math.abs(p.y - c.y);
    const time = (dist / CLEANER_SPEED) * 1000;
    c.x = p.x; c.y = p.y;
    el.style.transition = "left " + time + "ms linear, top " + time + "ms linear";
    el.style.left = (c.x - 20) + "px";
    el.style.top = (c.y - 20) + "px";
    c.moveTimer = setTimeout(step, time);
  }
  step();
}

function stopCleaners() {
  game.cleaners.forEach(function(c) {
    c.token++;
    if(c.moveTimer) { clearTimeout(c.moveTimer); c.moveTimer = null; }
    c.moving = false;
    const el = document.getElementById(c.id);
    if(el) {
      const parentRect = el.offsetParent ? el.offsetParent.getBoundingClientRect() : {left:0, top:0};
      const r = el.getBoundingClientRect();
      c.x = r.left - parentRect.left + 20;
      c.y = r.top - parentRect.top + 20;
      el.style.transition = "none";
      el.style.left = (c.x - 20) + "px";
      el.style.top = (c.y - 20) + "px";
    }
  });
}

function updateCleaners() {
  game.cleaners.forEach(function(c) {
    if(c.moving) return;
    const candidates = game.tables.filter(function(t) {
      return t.dirty && !t.cleaning && !game.cleaners.some(function(o) { return o!==c && o.targetTableId===t.id; });
    }).map(function(t) {
      const dock=getCleanerDock(t.id);
      return {table:t,dock:dock,route:planCleanerRoute(c.x,c.y,dock.x,dock.y)};
    }).filter(function(o) { return !!o.route; }).sort(function(a,b) { return a.route.length-b.route.length; });
    if(!candidates.length) {c.targetTableId=null;return;}
    const next=candidates[0], dirty=next.table;
    c.targetTableId=dirty.id;
    moveCleaner(c,next.dock.x,next.dock.y,function() {
      if(!dirty.dirty || dirty.cleaning) {c.targetTableId=null;return;}
      dirty.cleaning=true;
      dirty.cleanTimer=game.cleanSpeedDouble?1:2;
      c.targetTableId=null;
      renderTables();
      if(game.status==="running") updateCleaners();
    },next.route);
  });
}

function onTableClick(tableId) {
  if(game.status !== "running") return;
  const table = game.tables.find(function(t) { return t.id === tableId; });
  if(!table) return;

  if(table.dirty) { cleanTable(tableId); return; }

  if(game.selectedCoffee) {
    if(table.guests.length === 1) useCoffeeOnGuest(table.guests[0].id);
    else if(table.guests.length > 1) showChoice("赠送卡布奇诺", "请选择要恢复心情的客人", getVisualGuests(table).map(function(g, index) {
      const def = GUEST_TYPES[g.type];
      return {text:"第" + (index + 1) + "组 · " + def.name + "（" + g.hearts + "/5 心）", action:function() { useCoffeeOnGuest(g.id); }};
    }).concat([{text:"取消", action:function() {}}]));
    return;
  }
  if(game.selectedGuestId !== null) {
    seatGuest(tableId);
    return;
  }

  if(game.waiterRecording) return;

  walkToTable(tableId, function() {
    if(table.dirty) { startTableCleaning(tableId); return; }
    // 先一次送完本桌餐品，再由后续操作处理点单。
    if(serveCarriedFoodAtTable(tableId) > 0) return;
    const waitingGuest = table.guests.find(function(g) { return g.status === "waiting_order"; });
    if(waitingGuest) {
      if(game.carryItems.length >= getCarryCapacity()) {
        showInfo("服务员手上已满（" + game.carryItems.length + "/" + getCarryCapacity() + "），请先送餐或交单后再点单", "提示");
        return;
      }
      const recTime = getOrderRecordTime();
      if(recTime <= 0) {
        completeTakeOrder(waitingGuest.id);
      } else {
        waitingGuest.status = "recording";
        game.waiterRecording = { guestId: waitingGuest.id, remain: recTime };
        updateWaiterPosition();
        renderAll();
      }
      return;
    }
  });
}

function startTutorial() {
  game.tutorialStep = 0;

function tutorialNext(targetStep) {
  if(!game.tutorialEnabled) return;
  if(game.tutorialStep >= targetStep) return;
  game.tutorialStep = targetStep;
  if(targetStep > TUTORIAL_STEPS.length) {
    document.getElementById("tutorialOverlay").style.display = "none";
    return;
  }
  document.getElementById("tutorialOverlay").style.display = "block";
  const step = TUTORIAL_STEPS[targetStep - 1];
  document.getElementById("tutorialText").innerHTML = step.text.replace(/\n/g, "<br>");
  const highlight = document.getElementById("highlightBox");
  const box = document.getElementById("tutorialBox");
  let targetEl;
  switch(step.target) {
    case "btnStart": targetEl = document.getElementById("btnStart"); break;
    case "waitArea": targetEl = document.getElementById("waitArea"); break;
    case "diningArea": targetEl = document.querySelector(".dining-area"); break;
    case "chef": targetEl = document.querySelector(".chef-station"); break;
    case "shop": targetEl = document.getElementById("btnShop"); break;
    default: targetEl = null;
  }
  const boxW = 380;
  const boxH = box.offsetHeight || 160;
  const pad = 12;
  if(targetEl) {
    const rect = targetEl.getBoundingClientRect();
    highlight.style.left = rect.left + "px";
    highlight.style.top = rect.top + "px";
    highlight.style.width = rect.width + "px";
    highlight.style.height = rect.height + "px";
    highlight.style.display = "block";

    let bx = rect.left + rect.width / 2 - boxW / 2;
    let by = rect.bottom + 15;
    if(by + boxH > window.innerHeight - pad) by = rect.top - boxH - 15;
    if(by < pad) by = Math.max(pad, (window.innerHeight - boxH) / 2);
    bx = Math.max(pad, Math.min(bx, window.innerWidth - boxW - pad));

    box.style.left = bx + "px";
    box.style.top = by + "px";
    box.style.transform = "none";
  } else {
    highlight.style.display = "none";
    box.style.left = "50%";
    box.style.top = "50%";
    box.style.transform = "translate(-50%, -50%)";
  }
}

}

  game.tutorialEnabled = false;
  game.tutorialStep = 999;

function durationStars(sec, min, max) {
  return Math.max(1, Math.min(5, Math.round(1 + (sec - min) / (max - min) * 4)));
}
function patienceStars(decay) {
  return Math.max(1, Math.min(5, Math.round(1 + (1.7 - decay) / (1.7 - 0.7) * 4)));
}
function generosityStars(tip) {
  return Math.max(1, Math.min(5, Math.round(1 + (tip - 0.8) / (3.0 - 0.8) * 4)));
}
function starHtml(n) {
  let s = "";
  for(let i = 0; i < 5; i++) s += i < n ? "★" : '<span class="empty">★</span>';
  return '<span class="stars">' + s + '</span>';
}

              : '<div class="bc-row">🔒 还有 ' + Math.max(1, g.unlockDay - game.day) + ' 天到来</div>') +
          '</div></div>';
      }).join("") +
  '</div>';
}

const EVENT_WINDOW_LABEL = { early:"营业前段", mid:"营业中段", late:"营业后段", any:"随机时段" };

function renderEventBook() {
  const box = document.getElementById("bookEventList");
  box.innerHTML = '<div class="book-grid">' +
    EVENTS.map(function(ev) {
      const unlocked = game.triggeredEvents.indexOf(ev.id) !== -1;
      const effect = EVENT_EFFECT_DESC[ev.id] || "";

        '<div class="bc-icon">' + (unlocked ? ev.icon : "❓") + '</div>' +
        '<div class="bc-body">' +
          '<div class="bc-name">' + (unlocked ? ev.name : "？？？") + '</div>' +
          '<div class="bc-desc">' + (unlocked ? ev.desc : "尚未触发的神秘事件") + '</div>' +
          (unlocked
            ? '<div class="bc-row">时段：' + (EVENT_WINDOW_LABEL[ev.timeWindow] || "随机") + '</div>' +
              '<div class="bc-row">持续：' + ev.duration + ' 秒</div>' +
              '<div class="bc-row">效果：' + effect + '</div>'

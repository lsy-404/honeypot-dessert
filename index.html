function getUpgradeLevel(id) {
  switch(id) {
    case "day_length": return game.dayLengthLevel;
    case "waiter_speed": return game.waiterSpeedLevel;
    case "cook_speed": return game.cookSpeedLevel;
    case "hire_chef": return game.chefCount - 1;
    case "hire_cleaner": return game.cleanerCount;
    case "clean_speed": return game.cleanSpeedDouble ? 1 : 0;
    case "heart_decay": return game.heartDecayExtra > 0 ? 1 : 0;
    case "tip_upgrade": return game.tipLevel;
    case "wait_capacity": return game.waitCapacity > 3 ? 1 : 0;
    case "coffee_machine": return game.hasCoffeeMachine ? 1 : 0;
    case "coffee_batch": return game.coffeeLevel>=1?1:0;
    case "coffee_auto": return game.coffeeLevel>=2?1:0;
    case "smart_waiter": return game.smartWaiterOwned?1:0;
    case "smart_guests": return game.smartGuestsOwned?1:0;
    case "add_table": return game.tables.length - 2;
    case "upgrade_4seat": return game.tables.filter(function(t) { return t.capacity >= 4; }).length;
    case "upgrade_6seat": return game.tables.filter(function(t) { return t.capacity >= 6; }).length;
    case "menu_optimize": return game.menuOptimizeLevel;
    case "order_record": return game.orderRecordLevel;
    case "carry_capacity": return game.carryCapacityLevel;
    default: return 0;
  }
}


const UPGRADE_CATEGORIES = {
  service: ["waiter_speed", "order_record", "carry_capacity", "smart_waiter"],
  kitchen: ["cook_speed", "hire_chef", "hire_cleaner", "clean_speed"],
  space: ["wait_capacity", "add_table", "upgrade_4seat", "upgrade_6seat", "smart_guests"],
  guest: ["day_length", "menu_optimize", "heart_decay", "tip_upgrade", "coffee_machine", "coffee_batch", "coffee_auto"]
};
let activeUpgradeCategory = "service";
const UPGRADE_LABELS = {
  smart_waiter:"聪明的服务员",smart_guests:"聪明的顾客",coffee_batch:"双杯卡布奇诺",coffee_auto:"自动赠饮",
  day_length:"营业时长", waiter_speed:"服务员移速", cook_speed:"制作速度", hire_chef:"增聘厨师",
  hire_cleaner:"自动清洁工", clean_speed:"清理速度", heart_decay:"耐心提升", tip_upgrade:"小费比例",
  wait_capacity:"等候区扩容", coffee_machine:"咖啡机", add_table:"新增餐桌", upgrade_4seat:"四人桌",
  upgrade_6seat:"六人桌", menu_optimize:"菜单优化", order_record:"点单记录", carry_capacity:"托盘容量"
};
function getNextUpgradeEffect(id, level) {
  switch(id) {
    case "day_length": return "每日营业模拟时长增至 " + (90 + (level + 1) * 45) + " 秒";
    case "waiter_speed": return "服务员移速达到基础速度的 " + (100 + (level + 1) * 20) + "%";
    case "cook_speed": return "制作所需时间缩短至基础时长的 " + (100 - (level + 1) * 15) + "%";
    case "hire_chef": return "新增 1 个独立灶台，可同时制作 " + (game.chefCount + 1) + " 份餐品";
    case "hire_cleaner": return "新增 1 位自动清洁工，共 " + (game.cleanerCount + 1) + " 位";
    case "clean_speed": return "脏桌清理所需时间缩短一半";
    case "heart_decay": return "客人心情掉落间隔增加 5 秒";
    case "tip_upgrade": return "结账小费比例额外增加 1 个百分点";
    case "wait_capacity": return "等候区可同时容纳 5 组客人";
    case "coffee_machine": return "解锁卡布奇诺，每 8 秒制作 1 杯，恢复 1 颗心";
    case "coffee_batch": return "每批制作 2 杯卡布奇诺，可分别赠送给客人";
    case "coffee_auto": return "自动把做好且未使用的卡布奇诺赠给非满心客人，优先心情较低者";
    case "smart_waiter": return "自动点单、交单、取餐、送餐和结账，空闲时清桌；可随时开关";
    case "smart_guests": return "等候客人自动选择合适餐桌，优先凑满可坐人数；可随时开关";
    case "add_table": return "新增 1 张双人桌，共 " + (game.tables.length + 1) + " 张餐桌";
    case "upgrade_4seat": return "将 1 张双人桌升级为四人桌";
    case "upgrade_6seat": return "将 1 张四人桌升级为六人桌";
    case "menu_optimize": return "客人看菜单所需时间缩短至 " + (level === 0 ? "6–12" : "3–6") + " 秒";
    case "order_record": return level === 0 ? "记录每份订单所需时间缩短至 2 秒" : "立即完成点单记录，无需等待";
    case "carry_capacity": return "托盘可携带 " + (3 + level) + " 个订单或餐品";
    default: return "";
  }
}

function renderUpgradeList() {
  document.querySelectorAll('.ops-tabs .sub-tab').forEach(function(b){b.classList.toggle('active',b.dataset.ops===activeUpgradeCategory);});
  const list = document.getElementById("upgradeList");
  list.innerHTML = "";
  UPGRADE_DATA.filter(function(up) { return UPGRADE_CATEGORIES[activeUpgradeCategory].includes(up.id)&&upgradeUnlocked(up.id); }).forEach(function(up) {
    const level = getUpgradeLevel(up.id);
    const maxed = level >= up.max_level;
    const unavailable = upgradeUnavailable(up.id);
    const price = getUpgradePrice(up);
    const div = document.createElement("div");
    div.className = "upgrade-item upgrade-card" + (maxed ? " maxed" : "");
    div.dataset.upgrade = up.id;
    const content = document.createElement("div");
    content.className = "upgrade-copy";
    const title = document.createElement("div");
    title.className = "upgrade-title";
    title.textContent = UPGRADE_LABELS[up.id] || up.name;
    const badge = document.createElement("span");
    badge.className = "upgrade-level";
    badge.textContent = maxed ? "已完成" : up.max_level > 1 ? "当前 Lv." + level : "未购买";
    title.appendChild(badge);
    const effect = document.createElement("p");
    effect.className = "upgrade-effect";
    const smart = up.id==="smart_waiter"||up.id==="smart_guests";
    effect.textContent = maxed&&!smart ? "已完成全部升级" : getNextUpgradeEffect(up.id, level);
    content.appendChild(title); content.appendChild(effect); div.appendChild(content);
    const btn = document.createElement("button");
    btn.className = "buy-btn";
    btn.textContent = maxed ? "已满级" : unavailable ? "暂无可升级餐桌" : price + " 金币";
    btn.disabled = maxed || unavailable || game.money < price;
    btn.onclick = function() { buyUpgrade(up, price); };
    if(smart&&maxed){const waiter=up.id==="smart_waiter";const enabled=waiter?game.smartWaiterEnabled:game.smartGuestsEnabled;btn.disabled=false;btn.classList.add("automation-toggle");btn.setAttribute("aria-pressed",String(!!enabled));btn.textContent=enabled?"已开启 · 点击关闭":"已关闭 · 点击开启";btn.onclick=function(){toggleSmartFeature(waiter?"waiter":"guests");};}
    div.appendChild(btn); list.appendChild(div);
  });
  if((activeUpgradeCategory==='service'&&!serviceBasicsComplete()&&!game.smartWaiterOwned)||(activeUpgradeCategory==='space'&&!spaceBasicsComplete()&&!game.smartGuestsOwned)){
    const note=document.createElement('p');note.className='unlock-note';note.textContent='完成本分类全部基础升级后，解锁'+(activeUpgradeCategory==='service'?'「聪明的服务员」':'「聪明的顾客」');list.appendChild(note);
  }
}

function renderFoodList() {
  renderFoodPane("drink", "foodListDrink");
  renderFoodPane("dessert", "foodListDessert");
}
function renderFoodPane(type, elementId) {
  const list = document.getElementById(elementId);
  list.innerHTML = "";
  Object.keys(FOOD_DATA).forEach(function(name) {
    const data = FOOD_DATA[name];
    if(data.type !== type) return;
    const owned = game.unlockedFoods.indexOf(name) !== -1;
    const div = document.createElement("div");
    div.className = "upgrade-item";
    const typeLabel = data.type === "drink" ? "饮品" : "甜点";
    div.innerHTML = "<span>" + data.icon + " " + name + "（" + typeLabel + "，" + data.price + "金币/份）"
      + (owned ? ' <span style="color:#2ecc71;font-size:11px;">已解锁</span>' : "") + "</span>";
    if(!owned) {
      const btn = document.createElement("button");
      btn.className = "buy-btn";
      btn.style.background = "#2e8b57";
      btn.textContent = data.unlock_price + " 金币";
      btn.disabled = game.money < data.unlock_price;
      btn.onclick = function() { unlockFood(name, data.unlock_price); };
      div.appendChild(btn);
    }
    list.appendChild(div);
  });
}
function renderDecorList() {
  const list = document.getElementById("decorList");
  list.innerHTML = "";
  DECOR_DATA.forEach(function(d) {
    const level = game.decorLevel[d.id] || 0;
    const maxed = level >= d.max_level;
    const price = d.base_price * Math.pow(2, level);
    const div = document.createElement("div");
    div.className = "upgrade-item";
    const desc = d.desc[Math.min(level, d.desc.length - 1)];
    div.innerHTML = "<span>" + d.name + "（Lv." + level + "/" + d.max_level + "）<br>"
      + '<span style="font-size:11px;color:#999;">' + desc + "（环境值，心情掉得更慢）</span></span>";
    const btn = document.createElement("button");
    btn.className = "buy-btn";
    btn.style.background = "#2d8659";
    btn.textContent = maxed ? "已满级" : price + " 金币";
    btn.disabled = maxed || game.money < price;
    btn.onclick = function() { buyDecor(d); };
    div.appendChild(btn);
    list.appendChild(div);
  });
}

function applyDecor() {
  const canvas = document.getElementById("tablesCanvas");
  const d = game.decorLevel;
  if(d.floor >= 2) canvas.style.background = "repeating-linear-gradient(45deg,var(--floor-plank),var(--floor-plank) 18px,var(--floor-grain) 18px,var(--floor-grain) 36px)";
  else if(d.floor === 1) canvas.style.background = "var(--floor-base)";
  else canvas.style.background = "";
  const dining = document.querySelector(".dining-area");
  if(d.wall >= 2) dining.style.background = "var(--wall-level-2)";
  else if(d.wall === 1) dining.style.background = "var(--wall-level-1)";
  else dining.style.background = "";
  canvas.setAttribute("data-plants", d.plant);
  renderDecorations();
}

function renderDecorations() {
  const canvas = document.getElementById("tablesCanvas");
  Array.from(canvas.querySelectorAll(".deco-plant")).forEach(function(el) { el.remove(); });
  const n = game.decorLevel.plant;
  const icons = ["🪴","🌿","🌱","🌴","🌷","🌵","🍀","🌾","🌻","🪷"];
  for(let i = 0; i < n; i++) {
    const el = document.createElement("div");
    el.className = "deco-plant";
    el.textContent = icons[i % icons.length];
    el.style.left = (10 + (i % 10) * 55) + "px";
    el.style.top = (8 + Math.floor(i / 10) * 30) + "px";
    canvas.appendChild(el);
  }
}

function buyUpgrade(upgrade, price) {
  if(!UPGRADE_DATA.includes(upgrade)||upgradeUnavailable(upgrade.id)||getUpgradeLevel(upgrade.id)>=upgrade.max_level)return;
  price=getUpgradePrice(upgrade);
  if(!isFinite(price) || price <= 0) return;
  if(game.money < price) return;
  let valid = true;
  switch(upgrade.id) {
    case "day_length":
      game.dayLengthLevel++;
      game.dayLength = 90 + game.dayLengthLevel * 45;
      game.timeLeft = Math.max(game.timeLeft, game.dayLength);
      break;
    case "waiter_speed": game.waiterSpeedLevel++; break;
    case "cook_speed": game.cookSpeedLevel++; break;
    case "hire_chef":
      if(game.chefCount < 3) {
        game.chefCount++;
        game.cookingStations.push({order: null, progress: 0});
      } else valid = false;
      break;
    case "hire_cleaner":
      if(game.cleanerCount < 2) {
        game.cleanerCount++;
        ensureCleaners();
      } else valid = false;
      break;
    case "clean_speed": game.cleanSpeedDouble = true; break;
    case "heart_decay": game.heartDecayExtra = 5; break;
    case "tip_upgrade": game.tipLevel++; break;
    case "wait_capacity": game.waitCapacity = 5; break;
    case "smart_waiter": game.smartWaiterOwned=true;game.smartWaiterEnabled=true;break;
    case "smart_guests": game.smartGuestsOwned=true;game.smartGuestsEnabled=true;break;
    case "coffee_batch": game.coffeeLevel=1;break;
    case "coffee_auto": game.coffeeLevel=2;break;
    case "coffee_machine":
      game.hasCoffeeMachine = true;
      document.getElementById("coffeeMachine").style.display = "block";
      break;
    case "add_table":
      if(game.tables.length < 8) {
        game.tables.push({id: Date.now()+Math.random(), capacity:2, guests:[], dirty:false, sharedOnce:false});
      } else valid = false;
      break;
    case "upgrade_4seat":
      const t2 = game.tables.find(function(t) { return t.capacity === 2; });
      if(t2) t2.capacity = 4; else valid = false;
      break;
    case "upgrade_6seat":
      const t4 = game.tables.find(function(t) { return t.capacity === 4; });
      if(t4) t4.capacity = 6; else valid = false;
      break;
    case "menu_optimize":
      if(game.menuOptimizeLevel < 2) game.menuOptimizeLevel++; else valid = false;
      break;
    case "order_record":
      if(game.orderRecordLevel < 2) game.orderRecordLevel++; else valid = false;
      break;
    case "carry_capacity":
      if(game.carryCapacityLevel < 3) game.carryCapacityLevel++; else valid = false;
      break;
  }
  if(!valid) return;
  game.money -= price;
  renderAll();
  refreshShop();
}

function unlockFood(name, price) {
  if(!FOOD_DATA[name]||game.unlockedFoods.includes(name))return;
  price=FOOD_DATA[name].unlock_price;
  if(game.money < price) return;
  game.money -= price;
  game.unlockedFoods.push(name);
  refreshShop();
  renderAll();
}

function buyDecor(d) {
  const level = game.decorLevel[d.id] || 0;
  if(level >= d.max_level) return;
  const price = d.base_price * Math.pow(2, level);
  if(game.money < price) return;
  game.money -= price;
  game.decorLevel[d.id] = level + 1;
  applyDecor();
  refreshShop();
  renderAll();
}

// The hosting site passes its main menu as <meta name="home-url">; without it there is nothing to return to.
(function() {
  const homeUrl = document.querySelector('meta[name="home-url"]')?.content;
  if(homeUrl) {
    document.getElementById("btnExit").href = homeUrl;
  } else {
    document.documentElement.classList.add("standalone");
    document.title = document.title.replace(/ \| Tiny Projects$/, "");
  }
})();

window.onload = init;
